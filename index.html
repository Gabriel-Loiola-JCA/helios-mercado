const mod = (title, text, body) => `<section class="mod"><div class="mod-head"><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}</div><div class="mod-body">${body}</div></section>`;

/* 1 · para onde foram */
function modWhere(T, P, cur, prev) {
  if (!P || !P.pax) return mod('Para onde foram os passageiros', 'Ligue “Comparar com período anterior” para ver ganhos e perdas.', '<div class="empty">Sem período anterior com dados.</div>');
  const us = focusShort();
  const effMkt = (T.pax - P.pax) * P.share, effShr = T.pax * (T.share - P.share), d = T.upax - P.upax;
  const parts = [{name: 'Tamanho do mercado', v: effMkt, t: `Se a parcela fosse a mesma do período anterior (${pct(P.share)}), a variação do mercado (${dpct(T.pax / P.pax - 1)}) daria ${sgn(effMkt)} passageiros.`},
    {name: 'Parcela (concorrência)', v: effShr, t: `Efeito da mudança de parcela (${pp(T.share - P.share)}) sobre o mercado atual: ${sgn(effShr)} passageiros.`},
    {name: `Total ${us}`, v: d, t: `${n0(P.upax)} → ${n0(T.upax)} passageiros (${sgn(d)}).`, us: 1}];
  const a = groupBy(cur, companyKey), b = groupBy(prev, companyKey);
  const keys = new Set([...a.keys(), ...b.keys()]);
  const sumP = (l) => (l || []).reduce((n, r) => n + r.pax, 0);
  const movers = [...keys].map((k) => { const x = sumP(a.get(k)), y = sumP(b.get(k)); return {k, name: companyName(k), v: x - y, x, y, s: x / T.pax, sp: y / P.pax}; })
    .filter((m) => Math.abs(m.v) >= .5 && !companyIsUs(m.k)).sort((p, q) => q.v - p.v);
  const top = movers.length > 14 ? [...movers.slice(0, 7), ...movers.slice(-7)] : movers;
  const gain = movers.filter((m) => !companyIsUs(m.k) && m.s - m.sp > 0).sort((p, q) => (q.s - q.sp) - (p.s - p.sp))[0];
  const main = Math.abs(effShr) >= Math.abs(effMkt)
    ? (effShr < 0 ? `${sgn(effShr)} passageiros por perda de parcela${gain ? ` — quem mais ganhou foi <em>${esc(gain.name)} (${pp(gain.s - gain.sp)})</em>` : ''}.` : `${sgn(effShr)} passageiros por ganho de parcela sobre a concorrência.`)
    : (effMkt < 0 ? `${sgn(effMkt)} passageiros porque o mercado encolheu — <em>não é perda para a concorrência</em>.` : `${sgn(effMkt)} passageiros vieram do crescimento do mercado.`);
  return mod('Para onde foram os passageiros', `Variação de ${esc(us)} separada em dois efeitos: o mercado inteiro andou, ou a concorrência levou (ou cedeu) parcela.`,
    `<p class="insight">${main}</p>
    ${divbars(parts, {val: (x) => x.v, right: (x) => `<b>${sgn(x.v)}</b>`, tip: (x) => `${x.name}\n${x.t}`, us: (x) => x.us})}
    <div><p class="h4">Concorrentes · quem ganhou e quem perdeu passageiros</p>
    ${divbars(top, {val: (x) => x.v, us: (x) => companyIsUs(x.k), color: (x) => colorOf(x.k), right: (x) => `${sgn(x.v)} ${deltaPill(x.s - x.sp)}`, tip: (x) => `${x.name}\n${n0(x.y)} → ${n0(x.x)} passageiros (${sgn(x.v)})\nParcela ${pct(x.sp)} → ${pct(x.s)} (${pp(x.s - x.sp)})`})}</div>`);
}

/* 2 · ao longo do tempo */
function modTime(R, cur, real) {
  const days = []; for (let d = R.a; d <= R.b; d = addD(d, 1)) days.push(d);
  const weekly = real && days.length > 62;
  const key = (d) => weekly ? addD(d, -((wdOf(d) + 6) % 7)) : d;
  const xs = [...new Set(days.map(key))];
  const by = groupBy(cur, (r) => key(r.d));
  const pts = xs.map((x) => tot(by.get(x) || []));
  const us = focusShort(), id = 'tl' + Math.random().toString(36).slice(2, 7), id2 = id + 'b';
  const lbl = (x) => weekly ? 'sem. ' + br(x) : `${WD[wdOf(x)]} ${br(x)}`;
  afterRender.push(() => lineSvg(id, xs, [
    {name: `Parcela ${us}`, color: 'var(--white)', values: pts.map((t) => t.pax ? t.share : null)},
    {name: 'Parcela de oferta', color: 'var(--muted)', dash: 1, values: pts.map((t) => t.cap ? t.fair : null)}],
  {yFmt: (v) => pct(v, 0), xFmt: (x) => br(x), tip: (i) => `${lbl(xs[i])}\nParcela ${us}: ${pct(pts[i].share)}\nOferta ${us}: ${pct(pts[i].fair)}\nMercado: ${n0(pts[i].pax)} · ${us}: ${n0(pts[i].upax)}`}));
  const best = pts.map((t, i) => ({t, i})).filter((x) => x.t.pax).sort((a, b) => b.t.share - a.t.share);
  const ins = best.length > 2 ? `Melhor ${weekly ? 'semana' : 'dia'}: <em>${lbl(xs[best[0].i])} (${pct(best[0].t.share)})</em> · pior: <em>${lbl(xs[best[best.length - 1].i])} (${pct(best[best.length - 1].t.share)})</em>` : '';
  return mod(real ? 'Parcela dia a dia' : 'Parcela por data de viagem', real ? `Linha cheia = parcela de passageiros. Tracejada = parcela das poltronas oferecidas: acima dela, ${esc(us)} enche mais que a média.` : 'Viagens ainda à venda: o que já foi comprado para cada data.',
    `${ins ? `<p class="insight" style="font-size:15px">${ins}</p>` : ''}<div class="legend"><span><i class="ln" style="background:var(--white)"></i>Parcela ${esc(us)}</span><span><i class="dash"></i>Parcela de oferta</span></div><div class="chart" id="${id}"></div>
    <div><p class="h4">Passageiros por ${weekly ? 'semana' : 'dia'} · ${esc(us)} × concorrência</p>
    ${columns(xs.map((x, i) => ({x, t: pts[i]})), {label: (o) => xs.length > 14 ? (xs.indexOf(o.x) % Math.ceil(xs.length / 10) === 0 ? br(o.x) : '') : br(o.x), us: (o) => o.t.upax, them: (o) => o.t.them,
      tip: (o) => `${lbl(o.x)}\n${us}: ${n0(o.t.upax)} · concorrência: ${n0(o.t.them)}\nParcela ${pct(o.t.share)}`, top: xs.length <= 16 ? (o) => o.t.pax ? pct(o.t.share, 0) : '' : null})}</div>`);
}

/* 3a · radar das linhas */
/* Fatia de mercado: o foco contra as maiores concorrentes, numa pizza (rosca) só. */
function modShare(companies, prev, total) {
  const priced = companies.filter((entry) => entry.pax > 0);
  if (!priced.length || !total.pax) return mod('Fatia de mercado', '', '<div class="empty">Sem passageiros no recorte.</div>')
    .replace('<section class="mod">', '<section class="mod share-card">');
  const usEntry = priced.filter((entry) => companyIsUs(entry.focus));
  const usPax = usEntry.reduce((sum, entry) => sum + entry.pax, 0);
  const rivals = priced.filter((entry) => !companyIsUs(entry.focus));
  const top = rivals.slice(0, 5), rest = rivals.slice(5);
  const restPax = rest.reduce((sum, entry) => sum + entry.pax, 0);
  const compare = prev.some((r) => r.pax > 0);
  const oldOf = (list) => list.reduce((sum, entry) => sum + (Number.isFinite(entry.previous) ? entry.previous : 0), 0);
  const slices = [
    {name: focusName(), pax: usPax, share: usPax / total.pax, old: oldOf(usEntry), us: true, focus: F.focus},
    ...top.map((entry) => ({name: entry.name, pax: entry.pax, share: entry.pax / total.pax, old: entry.previous, focus: entry.focus})),
    ...(restPax > 0 ? [{name: `Outras ${rest.length}`, pax: restPax, share: restPax / total.pax, old: oldOf(rest), rest: true}] : []),
  ];
  const tones = [62, 46, 34, 25, 18, 12];
  const R = 74, C = 2 * Math.PI * R, gap = slices.length > 1 ? 2.2 : 0;
  let start = 0;
  const arcs = slices.map((slice, i) => {
    const length = Math.max(0, slice.share * C - gap);
    const tone = slice.us ? 'var(--market-accent)' : `color-mix(in srgb, var(--white) ${tones[Math.min(i - 1, tones.length - 1)]}%, transparent)`;
    const tip = `${slice.name}\n${n0(slice.pax)} passageiros · ${pct(slice.share)}${compare && Number.isFinite(slice.old) ? `\nPeríodo anterior: ${pct(slice.old)}` : ''}`;
    const pick = slice.focus != null && !slice.us ? ` data-filter-focus="${esc(slice.focus)}" role="button" tabindex="0"` : '';
    const arc = `<circle class="slice${slice.us ? ' us' : ''}"${pick} cx="100" cy="100" r="${R}" style="--i:${i};stroke:${tone}" stroke-dasharray="${length.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-start).toFixed(2)}"${tipAttr(tip)}/>`;
    start += slice.share * C;
    slice.tone = tone;
    return arc;
  }).join('');
  const lead = slices[0];
  const delta = compare && Number.isFinite(lead.old) ? lead.share - lead.old : NaN;
  const donut = `<div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Fatia de mercado em passageiros"><g transform="rotate(-90 100 100)"><circle class="donut-track" cx="100" cy="100" r="${R}"/>${arcs}</g></svg>
    <div class="donut-center"><strong>${pct(lead.share)}</strong><span>${esc(focusShort())}</span>${Number.isFinite(delta) ? `<small class="${cls(delta, 5e-4)}">${pp(delta)}</small>` : ''}</div></div>`;
  const legend = `<ul class="share-legend">${slices.map((slice) => `<li class="${slice.us ? 'us' : ''}"${slice.focus != null && (!slice.us || F.focus !== 'JCA') ? ` data-filter-focus="${esc(slice.us ? 'JCA' : slice.focus)}" role="button" tabindex="0"` : ''}${tipAttr(`${slice.name}\n${n0(slice.pax)} passageiros`)}>
    <i style="background:${slice.tone}"></i><span>${esc(slice.name)}</span><b>${pct(slice.share)}</b>
    <small>${compare && Number.isFinite(slice.old) ? pp(slice.share - slice.old) : n0(slice.pax)}</small></li>`).join('')}</ul>`;
  return mod('Fatia de mercado', '', `<p class="share-sub">Passageiros estimados · ClickBus · ${n0(total.pax)} no recorte</p><div class="share-wrap">${donut}${legend}</div>`)
    .replace('<section class="mod">', '<section class="mod share-card">');
}

/* Quem puxa os passageiros em cada linha: o grupo inteiro contra toda a concorrência somada.
   Cada eixo vai até o líder da linha, para linhas grandes e pequenas pesarem igual. */
function blocView(cur) {
  const byM = F.mode === 'mkt';
  const keyOf = byM ? (r) => DB.dims.rotas[r.r].m : (r) => DB.dims.rotas[r.r].l;
  const groups = groupBy(cur, keyOf);
  const keys = (byM ? DB.markets : DB.dims.rotas.map((r) => r.l)).filter((k) => groups.has(k));
  const lines = keys.map((key) => { const t = tot(groups.get(key)); return {key, us: t.upax, them: t.them, total: t.pax}; }).filter((line) => line.total > 0);
  const us = focusShort(), them = F.focus === 'JCA' ? 'Concorrência' : 'Demais viações';
  const wins = lines.filter((line) => line.us > line.them).length;
  const sumUs = lines.reduce((sum, line) => sum + line.us, 0), sumThem = lines.reduce((sum, line) => sum + line.them, 0);
  const tip = (line) => `${line.key}\n${us}: ${n0(line.us)} · ${them}: ${n0(line.them)}\n${us} leva ${pct(line.us / line.total)} dos passageiros`;
  let chart;
  if (lines.length >= 3) {
    const lead = lines.map((line) => Math.max(line.us, line.them) || 1);
    chart = radarSvg(lines.map((line) => ({label: shortRoute(line.key).replace('⇄', '↔'), route: line.key, tone: line.us > line.them ? 'up' : ''})), [
      {kind: 's1', values: lines.map((line, i) => line.us / lead[i])},
      {kind: 's2', values: lines.map((line, i) => line.them / lead[i])},
    ], {max: 1, label: 'Passageiros por linha · grupo contra a concorrência somada', tip: (i) => tip(lines[i])});
  } else {
    // Poucas linhas: uma barra dividida por linha, no lugar do radar.
    chart = lines.length ? `<div class="bloc-bars">${lines.map((line) => `<div class="bloc-row" data-route-focus="${esc(line.key)}" role="button" tabindex="0"${tipAttr(tip(line))}>
      <span class="bloc-name">${esc(shortRoute(line.key).replace('⇄', '↔'))}</span>
      <div class="bloc-split"><i style="width:${(line.us / line.total * 100).toFixed(1)}%"></i><i></i></div>
      <span class="bloc-vals"><b>${pct(line.us / line.total)}</b> × ${pct(line.them / line.total)}</span></div>`).join('')}</div>`
      : '<div class="empty">Sem passageiros no recorte.</div>';
  }
  const legend = `<div class="lg2"><span><i></i>${esc(F.focus === 'JCA' ? 'Grupo JCA · todas as marcas' : us)}</span><span><i class="d"></i>${esc(them)} somada</span></div>`;
  const insight = lines.length ? `<p class="insight">${esc(us)} lidera em <em>${wins} de ${lines.length} ${byM ? (lines.length === 1 ? 'mercado' : 'mercados') : (lines.length === 1 ? 'linha' : 'linhas')}</em></p>` : '';
  return {chart, legend, insight, sumUs, sumThem, us, them};
}

/* Pizza da fatia de mercado, só o gráfico e a legenda (para a Sentinela). */
function shareVisual(rows, total) {
  if (!total.pax) return '';
  const box = document.createElement('div');
  box.innerHTML = modShare(companyMetrics(rows, [], total, null, F.focus === 'JCA'), [], total);
  return box.querySelector('.share-wrap')?.outerHTML || '';
}

/* Leitura do período: o mesmo veredito do topo da análise. */
function verdictOf(T, P) {
  if (!T.pax || !P || !P.pax) return null;
  const effMkt = (T.pax - P.pax) * P.share, effShr = T.pax * (T.share - P.share);
  if (effShr < 0 && Math.abs(effShr) >= Math.abs(effMkt)) return {text: 'Passageiros indo para a concorrência', tone: 'down'};
  if (effMkt < 0 && Math.abs(effMkt) > Math.abs(effShr)) return effShr >= 0 ? {text: 'Mercado encolheu, nossa parcela segurou', tone: 'flat'} : {text: 'Faltam passageiros no mercado', tone: 'down'};
  if (effShr > 0 && effShr >= Math.abs(effMkt)) return {text: 'Ganhando passageiros da concorrência', tone: 'up'};
  if (effMkt > 0) return effShr < 0 ? {text: 'Mercado cresceu, a concorrência cresceu mais', tone: 'down'} : {text: 'Mercado cresceu e acompanhamos', tone: 'up'};
  return {text: 'Estável', tone: 'flat'};
}

/* Sentinela em tela cheia: série diária de cada cartão, para o gráfico de fundo. */
function attachTrends(cards, rows) {
  const byDay = groupBy(rows, (row) => row.d);
  const days = [...byDay.keys()].sort();
  const daily = days.map((day) => tot(byDay.get(day)));
  const pick = (filter) => days.map((day) => byDay.get(day).filter(filter).reduce((sum, row) => sum + row.pax, 0));
  const routes = [...groupBy(rows, (row) => row.r)].map(([key, items]) => ({key, ...tot(items)})).sort((a, b) => b.upax - a.upax);
  const leaderRoute = routes[0]?.key;
  const companies = new Map();
  for (const row of rows) companies.set(row.v, (companies.get(row.v) || 0) + row.pax);
  const leaderCompany = [...companies].sort((a, b) => b[1] - a[1])[0]?.[0];
  const series = {
    share: daily.map((t) => t.share), period: daily.map((t) => t.share),
    volume: daily.map((t) => t.upax), update: daily.map((t) => t.upax), sales: daily.map((t) => t.upax),
    route: leaderRoute === undefined ? [] : days.map((day) => byDay.get(day).filter((row) => row.r === leaderRoute && isUs(row)).reduce((sum, row) => sum + row.pax, 0)),
    supply: daily.map((t) => t.lfUs), revenue: daily.map((t) => t.urec),
    company: leaderCompany === undefined ? [] : pick((row) => row.v === leaderCompany), status: daily.map((t) => t.pax),
  };
  for (const card of cards) card.series = series[card.key] || series.share;
}

function trendOf(values) {
  const list = values.filter(Number.isFinite);
  if (list.length < 2) return {dir: 'flat', change: 0};
  const part = Math.max(1, Math.floor(list.length / 3));
  const mean = (a) => a.reduce((s, v) => s + v, 0) / a.length;
  const a = mean(list.slice(0, part)), b = mean(list.slice(-part));
  const change = a ? (b - a) / Math.abs(a) : 0;
  return {dir: Math.abs(change) < .015 ? 'flat' : change > 0 ? 'up' : 'down', change};
}

function paintTheaterTrend(card) {
  const host = $('#theaterTrend');
  if (!host) return;
  if (card.visual) { host.innerHTML = ''; return; }
  const raw = card.series || [];
  // Média móvel centrada: mostra a direção, não o vaivém de cada dia.
  const win = Math.max(1, Math.round(raw.length / 6));
  const values = raw.map((_, i) => { const part = raw.slice(Math.max(0, i - win), i + win + 1).filter(Number.isFinite); return part.length ? part.reduce((s, v) => s + v, 0) / part.length : NaN; });
  const valid = values.filter(Number.isFinite);
  if (valid.length < 2) { host.innerHTML = ''; return; }
  const W = Math.max(640, host.clientWidth || innerWidth), H = Math.max(240, host.clientHeight || innerHeight * .5);
  const lo = Math.min(...valid), hi = Math.max(...valid), span = hi - lo || Math.abs(hi) || 1;
  const top = H * .3, bottom = H * .82;
  const points = values.map((v, i) => Number.isFinite(v) ? [W * .04 + i / (values.length - 1) * W * .92, bottom - (v - lo) / span * (bottom - top)] : null).filter(Boolean);
  const line = smoothOpen(points);
  const last = points.at(-1);
  const area = `${line}L${last[0].toFixed(1)},${H}L${points[0][0].toFixed(1)},${H}Z`;
  const {dir, change} = trendOf(raw);
  const words = {up: 'Em alta no período', down: 'Em queda no período', flat: 'Estável no período'};
  const arrow = {up: '↗', down: '↘', flat: '→'}[dir];
  const note = `${arrow} ${words[dir]}${dir === 'flat' ? '' : ` · ${dpct(change)}`}`;
  const anchor = last[0] > W * .8 ? 'end' : 'start';
  host.dataset.dir = dir;
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="tt-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--market-accent);stop-opacity:.16"/><stop offset="1" style="stop-color:var(--market-accent);stop-opacity:0"/></linearGradient></defs>
    <path class="tt-area" d="${area}" fill="url(#tt-fill)"/><path class="tt-line" d="${line}" pathLength="1"/>
    <circle class="tt-halo" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="16"/><circle class="tt-dot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="5"/>
    <text class="tt-note" x="${(last[0] + (anchor === 'end' ? -22 : 22)).toFixed(1)}" y="${(last[1] - 22).toFixed(1)}" text-anchor="${anchor}">${esc(note)}</text></svg>`;
}

function modRadar(cur, prev) {
  const us = focusShort();
  const byM = F.mode === 'mkt';
  const keyOf = byM ? (r) => DB.dims.rotas[r.r].m : (r) => DB.dims.rotas[r.r].l;
  const a = groupBy(cur, keyOf), b = groupBy(prev, keyOf);
  const keys = (byM ? DB.markets : DB.dims.rotas.map((r) => r.l)).filter((k) => a.has(k));
  const T = keys.map((k) => tot(a.get(k))), P = keys.map((k) => b.has(k) ? tot(b.get(k)) : null);
  const ser = [{kind: 's1', values: T.map((x) => x.pax ? x.share : null)}, {kind: 's2', values: T.map((x) => x.cap ? x.fair : null)}];
  if (prev.length) ser.push({kind: 's3', values: P.map((x) => x && x.pax ? x.share : null)});
  const tip = (i) => `${keys[i]}\nParcela ${us}: ${pct(T[i].share)} · ${n0(T[i].upax)} de ${n0(T[i].pax)}\nOferta ${us}: ${pct(T[i].fair)} das poltronas${P[i]?.pax ? `\nPeríodo anterior: ${pct(P[i].share)}` : ''}`;
  const shares = T.map((t) => t.share).filter(Number.isFinite);
  const hi = Math.max(...shares), lo = Math.min(...shares);
  const axes = keys.map((key, i) => ({label: shortRoute(key).replace('⇄', '↔'), route: key,
    tone: hi - lo < .0001 || !Number.isFinite(T[i].share) ? '' : T[i].share === hi ? 'up' : T[i].share === lo ? 'down' : ''}));
  const radar = keys.length >= 3;
  const chart = radar ? radarSvg(axes, ser, {tip, label: byM ? 'Radar por mercado' : 'Radar por sentido'})
    : hbars(axes.map((axis, i) => ({...axis, name: axis.label, i, share: T[i].share})).filter((x) => Number.isFinite(x.share)),
      {max: 1, val: (x) => x.share, right: (x) => `<b>${pct(x.share)}</b>`, tip: (x) => tip(x.i), us: () => false,
        route: (x) => x.route});
  const controls = `<div class="seg" aria-label="Agrupamento de linhas"><button type="button" data-radar-mode="dir" aria-pressed="${!byM}">Por sentido</button>
    <button type="button" data-radar-mode="mkt" aria-pressed="${byM}">Por mercado</button></div>`;
  return mod(radar ? 'Radar das linhas' : 'Parcela por linha', '',
    controls + colorKey([['up','Maior parcela'],['down','Menor parcela']]) +
    `<div class="lg2"><span><i></i>Parcela ${esc(us)}</span>${radar ? `<span><i class="d"></i>Parcela de oferta</span>${prev.length ? '<span><i class="o"></i>Período anterior</span>' : ''}` : ''}</div>
    ${byM ? '<small class="note">↔ reúne os dois sentidos do mesmo mercado.</small>' : ''}${chart}`);
}

/* 3 · ranking */
function modRank(cur, prev, T, companies) {
  const a = groupBy(cur, companyKey), b = groupBy(prev, companyKey);
  const Pt = prev.reduce((n, r) => n + r.pax, 0);
  const items = [...a.entries()].map(([k, l]) => { const t = tot(l); const y = (b.get(k) || []).reduce((n, r) => n + r.pax, 0);
    return {k, name: companyName(k), pax: t.pax, s: t.pax / T.pax, sp: Pt ? y / Pt : NaN, cap: t.cap, fair: t.cap / T.cap, lf: t.cap ? t.pax / t.cap : NaN, tk: t.pax ? t.rec / t.pax : NaN, n: t.n}; })
    .filter((x) => x.pax > 0).sort((p, q) => q.pax - p.pax);
  const usItems = items.filter((x) => companyIsUs(x.k));
  const pos = items.findIndex((x) => companyIsUs(x.k)) + 1;
  const offersOnly = companies.filter((company) => company.pax === null);
  return mod('Quem leva os passageiros', `Parcela estimada · ClickBus${F.group && F.focus === 'JCA' ? ' · Marcas JCA somadas' : ''}`,
    `${usItems.length ? `<p class="insight">${esc(usItems[0].name)} ocupa a <em>${pos}ª posição</em> entre as ${items.length} viações com estimativa.</p>` : ''}
    ${hbars(items.slice(0, 20), {val: (x) => x.s, us: (x) => companyIsUs(x.k), color: (x) => colorOf(x.k), right: (x) => `<b>${pct(x.s)}</b>${prev.length ? deltaPill(x.s - x.sp) : ''}`,
      tip: (x) => `${x.name}\n${n0(x.pax)} passageiros · parcela ${pct(x.s)}${prev.length ? ` (${pp(x.s - x.sp)})` : ''}\nOferta ${pct(x.fair)} das poltronas · ${n0(x.n)} ônibus\nOcupação ${pct(x.lf, 0)} · tíquete médio ${money(x.tk)}`})}
    ${items.length > 20 ? `<p class="note">+ ${items.length - 20} viações menores na tabela abaixo.</p>` : ''}
    ${offersOnly.length ? `<div class="rank-extra"><p>Menor tarifa anunciada · Quero Passagem</p><ul>${offersOnly.map((company) => `<li><span>${esc(company.name)}</span><b>${company.fare === null ? '—' : offerPrice.format(company.fare)}</b></li>`).join('')}</ul><p>Sem estimativa de passageiros para estas viações.</p></div>` : ''}`);
}

function companyMetrics(cur, prev, total, quero, grouped = F.group) {
  const focusOf = (r) => grouped && r.j ? 'JCA' : String(r.v);
  const names = new Map();
  const nameOf = (r) => {
    const focus = focusOf(r);
    if (!names.has(focus)) names.set(focus, companyLabel(companyName(focus)));
    return names.get(focus);
  };
  const previous = groupBy(prev, nameOf);
  const oldTotal = prev.reduce((sum, r) => sum + r.pax, 0);
  const companies = new Map();
  const direct = (name) => {
    if (!companies.has(name)) companies.set(name, {v: null, focus: null, name, pax: null, rec: null, fare: null, maps: {}});
    return companies.get(name);
  };
  for (const [name, rows] of groupBy(cur, nameOf)) {
    const pax = rows.reduce((sum, r) => sum + r.pax, 0);
    const rec = rows.reduce((sum, r) => sum + (Number.isFinite(r.rec) ? r.rec : 0), 0);
    const oldPax = (previous.get(name) || []).reduce((sum, r) => sum + r.pax, 0);
    const focus = focusOf(rows[0]);
    companies.set(name, {v: focus, focus, jca: rows.some((r) => r.j), name, pax, rec: rec > 0 || pax === 0 ? rec : null,
      share: pax / total.pax, previous: oldPax / oldTotal, fare: null, maps: {}});
  }
  for (const [, , company, , , price] of [...(quero?.offers || []), ...(quero?.busco || [])]) {
    const entry = direct(companyLabel(company));
    if (Number.isFinite(price) && price > 0 && (entry.fare === null || price < entry.fare)) entry.fare = price;
  }
  if (quero?.hasQuero) mapBrands.forEach(direct);
  if (F.direct) direct(F.direct);
  for (const [, , company, , , source, , , , free, unavailable] of quero?.maps || []) {
    const entry = direct(companyLabel(company));
    const stat = entry.maps[source] ??= {count: 0, free: 0, unavailable: 0};
    stat.count++; stat.free += free.length; stat.unavailable += unavailable.length;
  }
  return [...companies.values()].sort((a, b) => (b.pax ?? -1) - (a.pax ?? -1) || a.name.localeCompare(b.name, 'pt-BR'));
}

function modCompanyRadar(companies, prev, quero, cur = []) {
  const leaders = companies.filter((entry) => entry.pax > 0).slice(0, 7);
  const compare = prev.some((r) => r.pax > 0);
  const lead = leaders[0];
  const groupPax = companies.reduce((sum, entry) => sum + (entry.jca ? entry.pax || 0 : 0), 0);
  const otherPax = companies.reduce((sum, entry) => sum + (!entry.jca ? entry.pax || 0 : 0), 0);
  const signal = signalFor(groupPax, otherPax);
  const tip = (entry) => [entry.name, `${n0(entry.pax)} passageiros estimados · ${pct(entry.share)}`,
    ...(compare ? ['Período anterior · ' + pct(entry.previous)] : [])].join('\n');
  const chart = leaders.length >= 3 ? radarSvg(leaders.map((entry) => ({label: entry.name, key: entry.name, tone: entry.jca ? 'up' : 'down'})), [
    {kind: 's1', values: leaders.map((entry) => entry.share)},
    ...(compare ? [{kind: 's2', values: leaders.map((entry) => entry.previous)}] : []),
  ], {tip: (i) => tip(leaders[i]), signal, label: 'Parcela estimada de passageiros por empresa'}) : '';
  const legend = chart ? `<div class="lg2"><span><i></i>Recorte atual</span>${compare ? '<span><i class="d"></i>Período anterior</span>' : ''}</div>` : '';
  const headline = lead ? `<p class="insight signal-${signal}">${esc(lead.name)} · <em style="color:var(--signal)">${n0(lead.pax)} passageiros (${pct(lead.share)})</em></p>` : '';
  const controls = `<div class="company-tools"><button id="radarGroup" class="chip" type="button" aria-pressed="${F.group}">Agrupar JCA</button><button id="radarRivals" class="chip" type="button" aria-pressed="${F.rivals}" title="Grupo JCA contra toda a concorrência somada, linha a linha">Agrupar concorrência</button></div>`;
  if (F.rivals) {
    const bloc = blocView(cur);
    const all = bloc.sumUs + bloc.sumThem;
    const rec = (jca) => companies.reduce((sum, entry) => sum + ((!!entry.jca === jca) && entry.rec ? entry.rec : 0), 0);
    const pair = [
      {name: F.focus === 'JCA' ? 'Grupo JCA · todas as marcas' : bloc.us, pax: bloc.sumUs, rec: F.focus === 'JCA' ? rec(true) : null, us: true},
      {name: `${bloc.them} · todas somadas`, pax: bloc.sumThem, rec: F.focus === 'JCA' ? rec(false) : null, us: false},
    ];
    const rows = `<div class="company-head company-columns" aria-hidden="true"><span>Bloco</span><div class="company-metrics"><span>Passageiros<small>ClickBus</small></span><span>Receita estimada<small>ClickBus</small></span></div></div>
      <ul aria-label="Valores por bloco">${pair.map((entry) => `<li class="company-row company-columns"><span class="company-name signal-${entry.us ? 'up' : 'down'}"><i class="dot" style="--c:var(--signal)"></i>${esc(entry.name)}</span>
      <dl class="company-metrics"><div><dt>Passageiros</dt><dd>${n0(entry.pax)} <small>${all ? pct(entry.pax / all) : ''}</small></dd></div><div><dt>Receita</dt><dd${entry.rec ? '' : ' class="missing"'}>${entry.rec ? BRL.format(entry.rec) : '—'}</dd></div></dl></li>`).join('')}</ul>`;
    return mod('Por empresa', '', controls + bloc.legend + bloc.chart + bloc.insight +
      `<p class="note">${n0(bloc.sumUs)} × ${n0(bloc.sumThem)} passageiros estimados · cada eixo vai até o líder da linha</p><div class="company-values">${rows}</div>`)
      .replace('<section class="mod">', '<section class="mod company-card" id="por-empresa">');
  }
  const fareSources = quero?.hasQuero && quero?.hasBusco ? 'Quero Passagem / BusCo' : quero?.hasBusco ? 'BusCo' : 'Quero Passagem';
  const headers = `<div class="company-head company-columns" aria-hidden="true"><span>Viação</span><div class="company-metrics">
    <span>Passageiros<small>ClickBus</small></span><span>Receita estimada<small>ClickBus</small></span>
    ${quero ? `<span>Menor tarifa<small>${fareSources}</small></span>` : ''}</div></div>`;
  const value = (label, amount, cls = '') => `<div class="${cls}"><dt>${label}</dt><dd${amount === null ? ' class="missing" aria-label="Sem dados"' : ''}>${amount ?? '—'}</dd></div>`;
  const displayed = F.direct ? companies.filter((entry) => entry.name === F.direct) : companies;
  const ranking = displayed.length ? `${headers}<ul aria-label="Valores por viação">${displayed.map((entry) => `<li class="company-row company-columns">
    <button class="company-name signal-${entry.jca ? 'up' : 'down'}" type="button" data-company-focus="${esc(entry.name)}" aria-pressed="${F.direct ? F.direct === entry.name : entry.focus === F.focus}"><i class="dot" style="--c:var(--signal)"></i>${esc(entry.name)}</button>
    <dl class="company-metrics">${value('Passageiros estimados · ClickBus', entry.pax === null ? null : `${n0(entry.pax)} <small>${Number.isFinite(entry.share) ? pct(entry.share) : ''}</small>`)}
      ${value('Receita estimada · ClickBus', entry.rec === null ? null : BRL.format(entry.rec))}
      ${quero ? value('Menor tarifa · ' + fareSources, entry.fare === null ? null : offerPrice.format(entry.fare), 'company-fare') : ''}</dl>
      ${Object.keys(entry.maps).length ? `<div class="company-maps">${Object.entries(entry.maps).map(([source, stat]) => `<span title="Indisponível pode ser venda, reserva ou bloqueio."><b>${esc(source)}</b> · ${n0(stat.count)} mapa(s) · ${n0(stat.free)} livres · ${n0(stat.unavailable)} indisponíveis</span>`).join('')}</div>`
        : mapBrands.includes(entry.name) && quero ? '<small class="company-maps">Sem mapa no recorte</small>' : ''}</li>`).join('')}</ul>`
    : '<p class="empty">Sem dados para os filtros escolhidos.</p>';
  const coverage = quero ? `
    ${quero.memory ? '<a id="memory-open" href="#seat-memory">Memória de poltronas</a>' : ''}
    ${quero.maps ? `<a id="maps-open" href="#seat-maps">Ver poltronas${quero.maps.length ? ` (${n0(quero.maps.length)} mapas)` : ''}</a>` : ''}
    ${quero.offers.length ? '<a id="qp-open" href="#qp-offers">Ver partidas e preços</a>' : ''}
    ${quero.hasBusco ? `<a id="busco-open" href="#busco-offers">BusCo · ${n0(quero.busco.length)} ${quero.busco.length === 1 ? 'oferta' : 'ofertas'}</a>` : ''}` : '';
  const comparison = groupPax + otherPax > 0 ? `<p class="insight signal-${signal}"><em style="color:var(--signal)">${
    signal === 'up' ? 'Grupo JCA à frente' : signal === 'down' ? 'Concorrência à frente' : 'JCA e concorrência em equilíbrio'
  }</em> · ${n0(groupPax)} × ${n0(otherPax)} passageiros estimados</p>` : '';
  return mod('Por empresa', '', controls + colorKey([['up','Marcas JCA'],['down','Concorrência'],['flat','Equilíbrio']]) + legend + chart + comparison + headline +
    `<div class="company-values${quero ? ' with-fares' : ''}">${ranking}<div class="company-foot">${coverage}</div></div>`)
    .replace('<section class="mod">', '<section class="mod company-card" id="por-empresa">');
}

function externalSelection(range) {
  const data = DB.data;
  if (!data.quero && !data.busco) return null;
  const sr = ['SPO → SJR', 'SJR → SPO'];
  const jr = ['SPO → JDF', 'JDF → SPO'];
  const selected = DB.dims.rotas.filter((_, i) => !F.routes.size || F.routes.has(i));
  const routes = new Set(selected.map((route) => route.l));
  const matchesRoute = (label) => !F.routes.size || routes.has(label);
  const srRoutes = selected.filter((route) => sr.includes(shortRoute(route.l)));
  const jrRoutes = selected.filter((route) => jr.includes(shortRoute(route.l)));
  const hasQuero = !!data.quero && (!F.routes.size || srRoutes.length > 0);
  const attempts = (data.busco?.tentativas || []).filter((row) => matchesRoute(row[1]));
  const hasBusco = !!data.busco && (attempts.length > 0 || jrRoutes.length > 0 || srRoutes.length > 0 || !F.routes.size);
  if (!hasQuero && !hasBusco) return null;
  const classes = new Set([...F.classes].map((i) => DB.dims.classes[i]));
  const matches = (r) => matchesRoute(r[1]) && (!F.direct || companyLabel(r[2]) === F.direct) && (!classes.size || classes.has(r[3]))
    && (!F.wds.size || F.wds.has(wdOf(r[0]))) && hourOk(Number(r[4].slice(0, 2)));
  const offers = (data.quero?.rows || []).filter(matches);
  const busco = (data.busco?.rows || []).filter(matches);
  const maps = data.poltronas?.rows.filter((row) => matches(row) && (row[5] !== 'Quero Passagem' || mapBrands.includes(companyLabel(row[2]))));
  const memory = data.memoriaPoltronas?.rows.filter((row) => matches(row) && row[0] >= range.a && row[0] <= range.b);
  const {status, ultimaTentativa} = data.quero || {};
  const scoped = F.routes.size ? selected : [...srRoutes, ...jrRoutes];
  const line = scoped.length === 1 ? shortRoute(scoped[0].l)
    : scoped.length === 2 && srRoutes.length === 2 ? 'SPO ↔ SJR'
    : scoped.length === 2 && jrRoutes.length === 2 ? 'SPO ↔ JDF' : 'Rotas monitoradas';
  return {offers, busco, attempts, hasQuero, hasBusco, maps, memory, memoryPeriod: `${brY(range.a)} a ${brY(range.b)}`,
    status, ultimaTentativa, line, queroLine: srRoutes.length === 1 ? shortRoute(srRoutes[0].l) : 'SPO ↔ SJR'};
}

function modSeatMemory({memory, line, memoryPeriod}) {
  const groupKey = (row) => JSON.stringify([row[1], row[2], row[3], row[5], row[10]]);
  const groups = [...groupBy(memory, groupKey)].sort((a, b) => b[1].length - a[1].length);
  const cards = groups.map(([key, rows], index) => {
    const [, route, company, cls, , source, , , , , layout] = rows[0];
    const seats = new Map();
    for (const row of rows) {
      const first = new Set(row[9]);
      for (const label of new Set(row[8])) {
        if (!seats.has(label)) seats.set(label, {label, eligible: 0, first: 0});
        const seat = seats.get(label);
        seat.eligible++;
        if (first.has(label)) seat.first++;
      }
    }
    const leaders = [...seats.values()].filter((seat) => seat.first > 0)
      .sort((a, b) => b.first - a.first || b.first / b.eligible - a.first / a.eligible || a.label.localeCompare(b.label, 'pt-BR', {numeric:true})).slice(0, 8);
    const order = leaders.map(({label, first, eligible}) => `<li><b>${esc(label)}</b>
      <span class="seat-order-track" aria-hidden="true"><i style="width:${100 * first / eligible}%"></i></span>
      <span>${n0(first)} de ${n0(eligible)}</span></li>`).join('');
    const sample = rows.length === 1 ? '1 partida observada' : `${n0(rows.length)} partidas observadas`;
    return `<details class="seat-memory-card" data-memory="${esc(key)}"${index === 0 ? ' open' : ''}><summary>
      <strong>${esc(shortCompany(company))}</strong><small>${esc(shortRoute(route))} · ${esc(cls)} · ${esc(source)}</small>
      <small>${sample} · Mapa de ${n0(layout.split(', ').length)} poltronas</small></summary>
      <ul class="seat-order" aria-label="Poltronas mais vezes indisponíveis na primeira mudança">${order}</ul></details>`;
  }).join('');
  const body = cards ? `<div class="seat-list">${cards}</div>`
    : '<p class="empty">Histórico em formação. A primeira mudança aparece quando duas leituras do mesmo mapa mostram uma poltrona que passou de livre para indisponível.</p>';
  return mod('Memória de poltronas', `${esc(line)} · ${memoryPeriod} · Primeiras indisponibilidades nas concorrentes`, body +
    '<p class="note">“3 de 5” significa que a poltrona esteve entre as primeiras a ficar indisponíveis em 3 das 5 partidas em que estava livre antes da mudança. Mudanças na mesma leitura empatam. Indisponibilidade pode indicar venda, reserva ou bloqueio.</p>')
    .replace('<section class="mod">', '<section class="mod" id="seat-memory">');
}

let reportScript;
async function downloadReport(format) {
  const status = $('#exportStatus');
  if (!status || status.dataset.busy) return;
  const range = ranges(), real = F.view === 'real';
  const rows = pick(range.a, range.b, real ? 0 : 1);
  const prior = real && F.cmp ? pick(range.pa, range.pb, 0) : [];
  const totals = tot(rows), external = externalSelection(range);
  const selected = F.direct || (F.focus !== 'JCA' ? companyLabel(focusName()) : '');
  const include = (name) => !selected || companyLabel(name) === selected;
  const metrics = companyMetrics(rows, prior, totals, external, !selected && F.group).filter((c) => include(c.name));
  const tripRows = rows.filter((r) => !selected || include(companyName(r.v)));
  const scope = ['#sumR', '#sumC', '#sumH', '#sumW'].map((id) => $(id).textContent).join(' · ');
  const market = real ? 'Realizado' : 'Em venda';
  const summary = [`Mercado observado: ${n0(totals.pax)} passageiros estimados`,
    `${focusName()}: ${n0(totals.upax)} passageiros estimados · ${pct(totals.share)} de parcela`,
    `Agrupamento JCA: ${F.group ? 'sim' : 'não'}`];
  if (prior.length) summary.push(`Anterior (${brY(range.pa)} a ${brY(range.pb)}): ${pct(tot(prior).share)} de parcela`);
  const report = {
    file: `Helios-${range.a}-${range.b}`, period: `${market} · ${brY(range.a)} a ${brY(range.b)}`,
    scope: scope + (selected ? ` · Viação: ${selected}` : ''),
    summary,
    blocks: [
      {title:'Empresas', headers:['Viação', 'Passag. est.', 'Parcela', 'Receita est. (R$)', 'Menor tarifa (R$)'],
        rows:metrics.map((m) => [m.name, m.pax, Number.isFinite(m.share) ? m.share : null, m.rec, m.fare]),
        formats:{1:'integer', 2:'percent', 3:'money', 4:'money'}},
      {title:'Por linha', headers:['Sentido', 'Passag. est.', 'Poltronas', 'Receita est. (R$)'],
        rows:[...groupBy(tripRows, (r) => shortRoute(DB.dims.rotas[r.r].l))].map(([route, list]) => {
          const sum = tot(list);
          return [route, sum.pax, sum.cap, sum.rec];
        }), formats:{1:'integer', 2:'integer', 3:'money'}},
      {title:'Disponibilidade por fonte', headers:['Viação', 'Fonte', 'Mapas', 'Livres', 'Indisponíveis'],
        rows:metrics.flatMap((m) => Object.entries(m.maps).map(([source, s]) => [m.name, source, s.count, s.free, s.unavailable]))},
    ],
    details: [
      {title:'Viagens ClickBus', headers:['Data', 'Linha', 'Viação', 'Classe', 'Hora', 'Ônibus', 'Poltronas', 'Passag. est.', 'Receita est. (R$)'],
        rows:tripRows.map((r) => [r.d, shortRoute(DB.dims.rotas[r.r].l), companyName(r.v), DB.dims.classes[r.c], r.h, r.n, r.cap, r.pax, r.rec])},
      {title:'Tarifas futuras', headers:['Data', 'Linha', 'Viação', 'Classe', 'Partida', 'Tarifa (R$)', 'Fonte'],
        rows:[['Quero Passagem', external?.offers], ['BusCo', external?.busco]].flatMap(([source, list]) =>
          (list || []).filter((r) => include(r[2])).map((r) => [r[0], shortRoute(r[1]), companyLabel(r[2]), ...r.slice(3, 6), source]))},
      {title:'Mapas futuros', headers:['Data', 'Linha', 'Viação', 'Classe', 'Partida', 'Fonte', 'Livres', 'Indisponíveis', 'Leitura BRT'],
        rows:(external?.maps || []).filter((r) => include(r[2])).map((r) => [r[0], shortRoute(r[1]), companyLabel(r[2]), ...r.slice(3, 6),
          r[9].length, r[10].length, new Date(r[8]).toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo'})])},
    ],
  };
  status.dataset.busy = '1';
  status.textContent = 'Preparando…';
  try {
    const base = /script\.google|googleusercontent/.test(location.hostname)
      ? 'https://gabriel-loiola-jca.github.io/helios-mercado/' : location.href;
    reportScript ??= new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = new URL('report-export.js', base).href;
      script.onload = resolve;
      script.onerror = () => { reportScript = null; script.remove(); reject(new Error('Falha ao carregar a exportação')); };
      document.head.append(script);
    });
    await reportScript;
    await window.exportHelios(format, report);
    status.textContent = 'Arquivo gerado';
  } catch (error) {
    console.warn(error);
    status.textContent = 'Falha na exportação. Tente novamente.';
  } finally {
    delete status.dataset.busy;
  }
}

    : '<p class="empty">Sem ofertas válidas da Quero Passagem neste recorte.</p>';

function modBusco({busco, attempts, maps}) {
  const directMaps = (maps || []).filter((row) => row[5] === 'BusCo');
  const tripKey = (row, terminals) => JSON.stringify([...row.slice(0, 5), ...terminals]);
  const byTrip = new Map(directMaps.map((row) => [tripKey(row, row.slice(6, 8)), row]));
  const fmt = new Intl.DateTimeFormat('pt-BR', {timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
  const latest = [...groupBy(attempts, (row) => row[1]).values()].map((rows) => rows.reduce((a, b) => a[2] >= b[2] ? a : b));
  const status = latest.map((row) => `${shortRoute(row[1])}: ${fmt.format(row[2])} · ${row[3]}`).map(esc).join(' | ');
  const body = busco.length ? `<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Linha</th><th>Classe</th><th>Partida</th><th>Tarifa</th><th>Poltronas no mapa</th></tr></thead><tbody>
    ${busco.map((row) => {
      const [day, route, , cls, time, price] = row;
      const map = byTrip.get(tripKey(row, row.slice(7, 9)));
      const seats = map ? `${n0(map[9].length)} livres · ${n0(map[10].length)} indisponíveis` : '—';
      return `<tr><td>${br(day)}</td><td>${esc(shortRoute(route))}</td><td>${esc(cls)}</td><td>${esc(time)}</td><td>${offerPrice.format(price)}</td><td>${seats}</td></tr>`;
    }).join('')}</tbody></table></div>`
    : '<p class="empty">Nenhuma oferta BusCo retornada nas datas consultadas para este recorte.</p>';
  return mod('Ofertas · BusCo', `${n0(busco.length)} ofertas · ${n0(directMaps.length)} mapas · Datas à venda`,
    body + (status ? `<p class="note">Última tentativa por sentido · ${status}</p>` : '<p class="note">Aguardando a primeira leitura da BusCo.</p>') +
    '<p class="note">Indisponível pode indicar venda, reserva ou bloqueio. As ofertas da BusCo ficam separadas dos passageiros e da receita estimados pela ClickBus.</p>')
    .replace('<section class="mod">', '<section class="mod" id="busco-offers">');
}

/* 4 · linha a linha */
function modRoutes(cur, prev) {
  const keyOf = F.mode === 'mkt' ? (r) => DB.dims.rotas[r.r].m : (r) => DB.dims.rotas[r.r].l;
  const a = groupBy(cur, keyOf), b = groupBy(prev, keyOf);
  const us = focusShort();
  const rows = [...a.entries()].map(([k, l]) => { const t = tot(l); const p = b.has(k) ? tot(b.get(k)) : null;
    const comp = [...groupBy(l, companyKey).entries()].map(([ck, cl]) => ({k: ck, name: companyName(ck), v: cl.reduce((n, r) => n + r.pax, 0), us: companyIsUs(ck)})).sort((x, y) => y.us - x.us || y.v - x.v);
    return {k, t, p, comp, ds: p && p.pax ? t.share - p.share : NaN}; }).filter((x) => x.t.pax > 0).sort((x, y) => y.t.pax - x.t.pax);
  const keyTot = new Map(); for (const x of rows) for (const c of x.comp) keyTot.set(c.k, (keyTot.get(c.k) || 0) + c.v);
  const keys = [...keyTot.entries()].sort((p, q) => companyIsUs(q[0]) - companyIsUs(p[0]) || q[1] - p[1]).slice(0, 12);
  const worst = rows.filter((r) => Number.isFinite(r.ds)).sort((x, y) => x.ds - y.ds)[0];
  const best = rows.filter((r) => Number.isFinite(r.ds)).sort((x, y) => y.ds - x.ds)[0];
  return mod('Linha a linha', `Composição dos passageiros em cada ${F.mode === 'mkt' ? 'mercado' : 'sentido'}: fatia cheia = ${esc(us)}, tons apagados = cada concorrente na cor dele. Passe o mouse nas fatias.`,
    `<div class="tools"><div class="seg" id="modeS"><button data-m="dir" aria-pressed="${F.mode === 'dir'}">Por sentido</button><button data-m="mkt" aria-pressed="${F.mode === 'mkt'}">Por mercado</button></div></div>
    ${worst && best && worst !== best ? `<p class="insight">Maior perda de parcela: <em>${esc(shortRoute(worst.k))} (${pp(worst.ds)})</em>. Maior ganho: <em>${esc(shortRoute(best.k))} (${pp(best.ds)})</em>.</p>` : ''}
    <div class="routes"><div class="rt h"><span>Linha</span><span class="stk">Composição</span><span class="n">Parcela</span><span class="n p3">Variação</span><span class="n">Ocupação</span></div>
    ${rows.map((x) => `<div class="rt"${tipAttr(`${x.k}\nMercado: ${n0(x.t.pax)} passageiros · ${us}: ${n0(x.t.upax)}\nParcela ${pct(x.t.share)} · oferta ${pct(x.t.fair)}${x.p ? `\nAntes: parcela ${pct(x.p.share)} · mercado ${n0(x.p.pax)}` : ''}\nOcupação ${us} ${pct(x.t.lfUs, 0)} × concorrência ${pct(x.t.lfThem, 0)}`)}>
      <div class="nm"><b>${esc(shortRoute(x.k))}</b><small>${n0(x.t.pax)} passageiros</small></div><div class="stk">${stack100(x.comp, x.t.pax)}</div>
      <div class="n"><b>${pct(x.t.share)}</b><small>oferta ${pct(x.t.fair, 0)}</small></div><div class="n p3">${deltaPill(x.ds) || '<span class="mut">—</span>'}</div>
      <div class="n">${pct(x.t.lfUs, 0)}<small>conc. ${pct(x.t.lfThem, 0)}</small></div></div>`).join('') || '<div class="empty">Sem dados.</div>'}</div>
    <div class="keys">${keys.map(([k]) => `<span>${dot(k)}${esc(companyName(k))}</span>`).join('')}</div>`);
}

/* 5 · dia da semana */

}

/* 6 · ocupação */
function modOcc(cur) {
  const us = focusShort();
  const by = groupBy(cur, (r) => DB.dims.rotas[r.r].l);
  const rows = [...by.entries()].map(([k, l]) => ({k, t: tot(l)})).filter((x) => x.t.ucap > 0 && x.t.cap - x.t.ucap > 0).sort((a, b) => (b.t.lfUs - b.t.lfThem) - (a.t.lfUs - a.t.lfThem));
  if (!rows.length) return mod('Ocupação: nós × concorrência', '', '<div class="empty">Sem linhas com as duas partes no recorte.</div>');
  const ticks = [0, .25, .5, .75, 1];
  return mod('Ocupação: nós × concorrência', `Ponto branco = ocupação de ${esc(us)}, círculo vazio = média da concorrência na mesma linha. Ocupação alta com parcela baixa = falta oferta, não procura.`,
    `<div class="dumb"><div class="axis"><span></span><div class="ticks">${ticks.map((t) => `<span style="left:${t * 100}%">${pct(t, 0)}</span>`).join('')}</div><span></span></div>
    ${rows.map((x) => { const a = Math.min(1, x.t.lfUs), b = Math.min(1, x.t.lfThem); const lo = Math.min(a, b), hi = Math.max(a, b); const d = x.t.lfUs - x.t.lfThem;
      return `<div class="drow ${cls(d, .005)}"${tipAttr(`${x.k}\nOcupação ${us}: ${pct(x.t.lfUs)} (${n0(x.t.upax)} de ${n0(x.t.ucap)} poltronas)\nConcorrência: ${pct(x.t.lfThem)} (${n0(x.t.them)} de ${n0(x.t.cap - x.t.ucap)})`)}>
        <div class="nm">${esc(shortRoute(x.k))}</div><div class="dtrack"><div class="ln" style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></div><div class="dot them" style="left:${b * 100}%"></div><div class="dot us" style="left:${a * 100}%"></div></div>
        <div class="val"><b>${pct(x.t.lfUs, 0)}</b> <span class="mut">× ${pct(x.t.lfThem, 0)}</span></div></div>`; }).join('')}</div>`);
}

/* 7 · próximos dias (sempre em venda) */
function modAhead() {
  const list = pick(DB.today, addD(DB.today, 14), 1);
  if (!list.length) return mod('Próximos 14 dias', '', '<div class="empty">Sem viagens à venda no recorte.</div>');
  const us = focusShort(); const T = tot(list);
  const by = groupBy(list, (r) => r.d);
  const days = []; for (let d = DB.today; d <= addD(DB.today, 14); d = addD(d, 1)) days.push(d);
  const pts = days.map((d) => ({d, t: tot(by.get(d) || [])}));

const marketPlan = {period: 'week', gain: 1};
const planPeriods = [['day', 'Dia'], ['week', 'Semana'], ['range', 'Período']];
const planGains = [1, 2, 5];

function planWindow(rows, range, realized, period) {
  const observed = rows.reduce((edge, row) => {
    if (!edge) return row.d;
    return (realized ? row.d > edge : row.d < edge) ? row.d : edge;
  }, null);
  if (!observed) return null;
  if (period === 'range') return {a: range.a, b: range.b};
  if (period === 'day') return {a: observed, b: observed};
  const a = realized ? addD(observed, -6) : observed;
  const b = realized ? observed : addD(observed, 6);
  return {a: a < range.a ? range.a : a, b: b > range.b ? range.b : b};
}

function planSeatScenario(total, own, gain) {
  if (!Number.isFinite(total) || !Number.isFinite(own) || !(total > 0) || own < 0 || own > total) return null;
  const share = own / total;
  const target = share + gain / 100;
  // Só as vendas do foco crescem. As demais ficam constantes.
  const incremental = (target * total - own) / (1 - target);
  const seats = target < 1 ? Math.max(1, Math.ceil(incremental - 1e-9)) : null;
  return {share, target, seats};
}

function planSensitivity(rows, cutoff, own) {
  if (!cutoff) return {pairs: 0, value: null};
  const start = addD(cutoff, -29);
  const observations = new Map();
  for (const row of rows) {
    if (row.open || row.d < start || row.d > cutoff || !own(row) || !(row.cap > 0)) continue;
    const weekend = row.wd === 0 || row.wd === 6;
    const key = [row.r, row.v, row.c, row.h, weekend].join('|');
    if (!observations.has(key)) observations.set(key, new Map());
    const days = observations.get(key);
    const day = days.get(row.d) || {cap: 0, pax: 0, revenue: 0, complete: true};
    day.cap += row.cap;
    day.pax += row.pax;
    day.revenue += row.rec;
    if (!Number.isFinite(row.pax) || row.pax < 0 || (row.pax > 0 && !(row.rec > 0))) day.complete = false;
    days.set(row.d, day);
  }
  const midpoint = (a, b) => 2 * (b - a) / (b + a);
  const matches = [];
  for (const days of observations.values()) {
    const ordered = [...days.entries()].sort(([a], [b]) => a.localeCompare(b));
    for (let i = 1; i < ordered.length; i++) {
      const [priorDate, prior] = ordered[i - 1], [date, day] = ordered[i];
      if (diffD(date, priorDate) > 14 || !prior.complete || !day.complete || prior.pax < 5 || day.pax < 5) continue;
      const priorLoad = prior.pax / prior.cap, load = day.pax / day.cap;
      // Lotação perto do teto pode esconder demanda que não conseguiu comprar.
      if (priorLoad >= .95 || load >= .95) continue;
      const priceMove = midpoint(prior.revenue / prior.pax, day.revenue / day.pax);
      if (!(Math.abs(priceMove) >= .05)) continue;
      matches.push({value: midpoint(priorLoad, load) / priceMove, weight: Math.min(prior.cap, day.cap)});
    }
  }
  if (matches.length < 8) return {pairs: matches.length, value: null};
  matches.sort((a, b) => a.value - b.value);
  let remaining = matches.reduce((sum, match) => sum + match.weight, 0) / 2;
  const typical = matches.find((match) => (remaining -= match.weight) <= 0);
  return {pairs: matches.length, value: typical.value};
}

function modMarketPlan(rows, range, realized) {
  const period = planWindow(rows, range, realized, marketPlan.period);
  const selected = period ? rows.filter((row) => row.d >= period.a && row.d <= period.b) : [];
  const sample = tot(selected);
  const scenario = planSeatScenario(sample.pax, sample.upax, marketPlan.gain);
  const ticket = selected.reduce((price, row) => {
    if (!isUs(row) || !(row.pax > 0) || !(row.rec > 0)) return price;
    price.passengers += row.pax;
    price.revenue += row.rec;
    return price;
  }, {passengers: 0, revenue: 0});
  const reference = ticket.passengers ? ticket.revenue / ticket.passengers : null;
  const spare = Math.max(0, Math.floor(sample.ucap - sample.upax + 1e-9));
  const dateText = period ? (period.a === period.b ? brY(period.a) : `${br(period.a)} a ${br(period.b)}`) : 'Sem datas no filtro';
  const observedDays = new Set(selected.map((row) => row.d)).size;
  const coverage = period && observedDays < diffD(period.b, period.a) + 1 ? ` · ${observedDays} ${observedDays === 1 ? 'dia observado' : 'dias observados'}` : '';
  const dateTitle = `${realized ? 'Realizado' : 'Em venda'} · ${dateText}${coverage}`;
  const cutoff = realized && period && period.b < DB.lastClosed ? period.b : DB.lastClosed;
  const observations = pick(addD(cutoff, -29), cutoff, 0);
  const sensitivity = planSensitivity(observations, cutoff, isUs);
  const showSensitivity = sensitivity.value !== null;
  const elastic = showSensitivity ? Math.abs(sensitivity.value) : null;
  const rate = showSensitivity ? NF1.format(sensitivity.value) : '—';
  const rateText = showSensitivity ? `+1% na tarifa ↔ ${sensitivity.value > 0 ? '+' : ''}${rate}% na ocupação · ${n0(sensitivity.pairs)} pares` : 'Histórico insuficiente';
  const meter = showSensitivity ? `<div class="plan-scale" aria-hidden="true"><div><span style="--level:${Math.min(100, 100 * elastic / 3)}%"></span></div><small>Menor sensibilidade</small><small>Maior sensibilidade</small></div>` : '';
  const group = esc(focusShort());
  const seats = scenario?.seats ?? null;
  const goal = scenario ? `${pct(scenario.share)} → ${pct(scenario.target)} de parcela` : '';
  const price = reference !== null ? offerPrice.format(reference) : '';
  const volume = seats !== null ? `~${n0(seats)} poltronas` : '';
  const pricing = price ? `a <strong>${price}</strong> por poltrona · simulação` : 'Tarifa de referência indisponível';
  return `<div class="plan-card">
    <div class="plan-top"><div><p class="eyebrow">Parcela de mercado</p><h2>Meta de ganho</h2></div>
      <div class="plan-switch" role="group" aria-label="Janela da meta">${planPeriods.map(([key, label]) => `<button type="button" data-plan-period="${key}" aria-pressed="${marketPlan.period === key}">${label}</button>`).join('')}</div></div>
    <div class="plan-base" data-plan-window>${dateTitle} · ${group}</div>
    <div class="plan-switch plan-target" role="group" aria-label="Ganho desejado em pontos percentuais">${planGains.map((gain) => `<button type="button" data-plan-gain="${gain}" aria-pressed="${marketPlan.gain === gain}">+${gain} p.p.</button>`).join('')}</div>
    <div class="plan-result" aria-live="polite">${volume ? `<p>Precisamos vender <strong data-plan-seats>${volume}</strong></p><p data-plan-price>${pricing}</p><p class="plan-note">${goal}${seats > spare ? ' · acima da folga observada' : ''}</p>` : `<p data-plan-seats>${scenario ? 'Ganho acima do limite de parcela.' : 'Ainda sem base para a meta neste recorte.'}</p>`}</div>
    <section class="plan-elasticity" data-plan-elasticity><div class="plan-elasticity-head"><div><p class="eyebrow">Preço × ocupação</p><h3>Elasticidade observada</h3></div><strong aria-label="Elasticidade observada ${rate}">${rate}</strong></div>
      ${meter}<p>${rateText}${showSensitivity ? '' : ` · ${n0(sensitivity.pairs)} de 8 pares mínimos`}</p>
      <details class="plan-method"><summary>Como ler</summary><p>A meta supõe vendas constantes das outras viações. A referência é a tarifa média estimada, ponderada pelas poltronas ocupadas nas observações com preço.</p><p>A elasticidade mostra a variação percentual da ocupação associada a 1% de variação na tarifa estimada. Usa a mediana ponderada pela oferta de até 30 dias fechados, com a mesma linha, viação, classe, faixa de partida e tipo de dia. Cada par tem ao menos 5% de variação no preço. É uma associação histórica, sem previsão de demanda.</p></details>
    </section>
  </div>`;
}

function bindMarketPlan(rows, range, realized) {
  const panel = $('#planning');
  if (!panel) return;
  panel.onclick = (event) => {
    const button = event.target.closest('button[data-plan-period], button[data-plan-gain]');
    if (!button || button.getAttribute('aria-pressed') === 'true') return;
    if (button.dataset.planPeriod) marketPlan.period = button.dataset.planPeriod;
    else marketPlan.gain = Number(button.dataset.planGain);
    const attribute = button.dataset.planPeriod ? 'data-plan-period' : 'data-plan-gain';
    transitionView((animated) => {
      paintDashboard(panel, modMarketPlan(rows, range, realized));
      if (!animated) animateDashboard(panel);
      panel.querySelector(`[${attribute}="${button.getAttribute(attribute)}"]`)?.focus({preventScroll: true});
    }, 'planning');
  };
}

/* Movimento do painel */
let activeViewMotion = null;
function transitionView(apply, kind) {
  document.documentElement.classList.remove('quiet-refresh');
  if (sentinelMotion.matches || typeof document.startViewTransition !== 'function' || document.visibilityState !== 'visible') {
    apply(false);
    return;
  }
  activeViewMotion?.skipTransition();
  hideTip();
  const root = document.documentElement;
  root.dataset.motion = kind;
  const motion = document.startViewTransition(() => apply(true));
  activeViewMotion = motion;
  motion.ready.catch(() => {});
  motion.finished.catch((error) => console.error('Falha ao atualizar o painel', error)).finally(() => {
    if (activeViewMotion !== motion) return;
    activeViewMotion = null;
    delete root.dataset.motion;
    flush();
  });
}
const movingDashboard = '#filterReceipt, #briefing > section, #hourly, #analysis, #hero, #kpis, #analysis #main > .mod, footer';
const dashboardAnimations = new WeakMap();
const revealedDashboard = new WeakSet();
const visibleDashboard = new WeakSet();
const observedDashboard = new Set();
const dashboardReveal = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    const element = entry.target;
    if (!observedDashboard.has(element)) continue;
    if (entry.isIntersecting) {
      const wasWaiting = element.classList.contains('reveal-await');
      element.classList.remove('reveal-await');
      visibleDashboard.add(element);
      revealedDashboard.add(element);
      if (wasWaiting) animateDashboard(element, true);
    } else {
      visibleDashboard.delete(element);
      const rect = entry.boundingClientRect;
      element.classList.toggle('reveal-await', rect.height > 0 && rect.top >= innerHeight - 16 && !revealedDashboard.has(element));
    }
  }
}, {threshold: 0, rootMargin: '0px 0px -16px'});

function animateDashboard(element, revealed = false) {
  if (sentinelMotion.matches) return;
  dashboardAnimations.get(element)?.forEach((animation) => animation.cancel());
  const easing = 'cubic-bezier(.16,1,.3,1)';
  const animations = [element.animate([
    {filter: revealed ? 'blur(5px)' : 'blur(2px)', transform: `translateY(${revealed ? 8 : 0}px)`},
    {filter: 'blur(0)', transform: 'none'},
  ], {duration: revealed ? 760 : 420, easing})];
  const numbers = element.querySelectorAll('.headline-share strong, .nums b, [data-plan-seats]:is(strong), .plan-elasticity-head > strong, .kpi .v, #hour-value');
  numbers.forEach((number, index) => animations.push(number.animate([
    {filter: 'blur(5px)'},
    {filter: 'blur(0)'},
  ], {duration: 600, delay: 80 + Math.min(index * 60, 180), fill: 'backwards', easing})));
  if (revealed && element.id !== 'analysis') {
    element.querySelectorAll('.chart-series').forEach((series) => animations.push(series.animate([
      {clipPath: 'inset(-8px 100% -8px -8px)'},
      {clipPath: 'inset(-8px)'},
    ], {duration: 840, delay: 80, fill: 'backwards', easing})));
  }
  dashboardAnimations.set(element, animations);
}

/* Marca em dourado o que está filtrado agora (linhas ou foco). */
function markActiveFilters() {
  for (const el of $$('[data-filter-routes]')) {
    const idx = el.dataset.filterRoutes.split(',').filter(Boolean).map(Number);
    el.classList.toggle('is-on', !!idx.length && F.routes.size === idx.length && idx.every((i) => F.routes.has(i)));
  }
  for (const el of $$('[data-filter-focus]')) el.classList.toggle('is-on', F.focus !== 'JCA' && el.dataset.filterFocus === String(F.focus));
}
function observeDashboardMotion(changed = null) {
  markActiveFilters();
  const elements = new Set($$(movingDashboard));
  if (sentinelMotion.matches) {
    dashboardReveal.disconnect();
    observedDashboard.clear();
    for (const element of elements) {
      visibleDashboard.delete(element);
      element.classList.remove('reveal-await');
    }
    return;
  }
  for (const element of observedDashboard) {
    if (elements.has(element)) continue;
    dashboardReveal.unobserve(element);
    observedDashboard.delete(element);
  }
  for (const element of elements) {
    if (!observedDashboard.has(element)) {
      observedDashboard.add(element);
      dashboardReveal.observe(element);
    }
    if (visibleDashboard.has(element) && (changed?.has(element) || changed?.has(element.parentElement))) {
      animateDashboard(element);
    }
  }
}

sentinelMotion.addEventListener('change', () => { if (sentinelMotion.matches) activeViewMotion?.skipTransition(); observeDashboardMotion(); });
document.addEventListener('toggle', (event) => {
  if (event.target.matches('#analysis[open]')) paintAnalysis?.();
  if (event.target.matches('#quickCharts, #analysis, .today-detail, .footer-method')) observeDashboardMotion();
}, true);

/* ---------- partida e atualização em segundo plano ---------- */
let lastFetch = 0, pending = null, busy = false, failed = false, manualRefresh = false, refreshScheduled = false;
const lastClickBus = (d) => {
  const sources = d.coleta?.fontes;
  const click = sources?.find((source) => source.f === 'ClickBus');
  return click ? click.ultimaValida ?? click.ultima : sources?.length ? '' : d.coleta?.ultimaLeitura;
};
function collectionStatus(data) {
  const last = lastClickBus(data);
  const mins = last ? (Date.now() - brtMs(last)) / 60000 : Infinity;
  const tick = data.coleta?.automacao;
  if (data.demo) return {text: 'Demonstração', alert: false};
  if (tick && Date.now() - tick.at > 25 * 60000) return {text: 'Gatilho sem resposta', alert: true};
  if (tick?.state === 'orcamento') return {text: 'Pausa por limite de execução', alert: true};
  if (tick?.state === 'janela') return {text: 'Coleta aguarda a próxima hora', alert: true};
  if (tick?.state === 'pausado') return {text: 'Coleta pausada', alert: true};
  if (tick?.state === 'erro') return {text: 'Erro na automação', alert: true};
  if (tick?.clickbusUntil > Date.now()) return {text: 'ClickBus em pausa', alert: true};
  if (!last) return {text: 'Sem leitura válida', alert: !!data.coleta};
  if (mins > 120) return {text: 'Coleta atrasada', alert: true};
  return {text: mins <= 20 ? 'Ao vivo' : 'Última coleta', alert: false};
}
const isStatic = () => !DB || DB.data.demo || !!$('#helios-gz').textContent.trim();
function stampTick() {
  const s = $('#stamp'), b = $('#reload'); if (!s || !DB) return;
  b.classList.toggle('busy', manualRefresh && busy); b.classList.toggle('bad', failed && !busy);
  const last = lastClickBus(DB.data), ref = last ? brtMs(last) : Date.parse(DB.data.gerado);
  const status = collectionStatus(DB.data);
  const stale = status.alert;
  b.classList.toggle('stale', stale && !busy && !failed && !DB.data.demo);
  const todayStamp = $('#todayStamp');
  if (todayStamp && last) {
    todayStamp.textContent = last.slice(11) + ' · ' + ago(ref);
    todayStamp.parentElement.classList.toggle('stale', stale && !DB.data.demo);
  }
  const label = manualRefresh && busy ? 'Atualizando…' : failed ? 'Sem conexão · <b>tentar</b>' : `${status.text}${last ? `<span class="stamp-age"> · <b>${ago(ref)}</b></span>` : ''}`;
  paintDashboard(s, label);
  b.title = isStatic() ? 'Dados fixos' : `Última leitura da ClickBus: ${last ? last.slice(8, 10) + '/' + last.slice(5, 7) + ' ' + last.slice(11) : '—'}\nPágina conferida ${lastFetch ? new Date(lastFetch).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : '—'} · busca sozinha a cada ${CONFIG.refreshMin} min\nClique para buscar agora`;
}
// só redesenha quando ninguém está mexendo (lista aberta, painel do "?" ou digitando)
const canRender = () => !$$('details.dd[open]').length && $('#help')?.hidden !== false && !document.activeElement?.matches?.('input');
const canApplyRefresh = () => pending && DB && document.visibilityState === 'visible'
  && !filterFrame && !activeViewMotion && canRender();
function flush() {
  if (refreshScheduled || !canApplyRefresh()) return;
  refreshScheduled = true;
  const apply = () => {
    refreshScheduled = false;
    if (!canApplyRefresh()) return;
    try {
      applyRefresh();
    } catch (error) {
      console.warn(error);
      failed = true;
      stampTick();
    }
  };
  if (typeof requestIdleCallback === 'function') requestIdleCallback(apply, {timeout: 2000});
  else setTimeout(apply, 0);
}
function applyRefresh() {
  const next = pending;
  pending = null;
  document.documentElement.classList.add('quiet-refresh');
  const y = scrollY;
  const previous = DB.dims;
  RAW = next.data;
  DB = next;
  if (!DB.hasClosed) F.view = 'venda';
  if (JSON.stringify(previous) !== JSON.stringify(DB.dims)) {
    const match = (items, label, key) => items.findIndex((item) => key(item) === label);
    const remap = (selected, before, after, key) => new Set([...selected]
      .filter((index) => before[index] !== undefined).map((index) => match(after, key(before[index]), key)).filter((index) => index >= 0));
    F.routes = remap(F.routes, previous.rotas, DB.dims.rotas, (route) => route.l);
    F.classes = remap(F.classes, previous.classes, DB.dims.classes, (name) => name);
    if (F.focus !== 'JCA') {
      const index = match(DB.dims.viacoes, previous.viacoes[Number(F.focus)]?.n, (company) => company.n);
      F.focus = index < 0 ? 'JCA' : String(index);
    }
    saveF();
    buildBar();
  }
  syncBar();
  render(false, true);
  if (scrollY !== y) scrollTo({top: y, behavior: 'instant'});
}
async function refresh(manual) {
  if (busy || isStatic()) return;
  manualRefresh = Boolean(manual);
  busy = true;
  if (manualRefresh) stampTick();
  try {
    const result = await fetchData(failed);
    const next = result?.data ? await model(result.data) : null;
    busy = false; failed = false; lastFetch = Date.now();
    if (result) {
      const {metadata} = result;
      if (next) pending = next;
      Object.assign(DB.data, metadata);
      if (pending) Object.assign(pending.data, metadata);
      flush();
    }
  } catch (error) {
    busy = false;
    if (error instanceof PanelAccessError) {
      manualRefresh = false;
      DB = RAW = pending = null;
      clearTimeout(sentinel.timer);
      shell();
      return panelSignIn(true);
    }
    console.warn(error);
    failed = true;
  }
  manualRefresh = false;
  stampTick();
}
function panelLoading() {
  $('#main').setAttribute('aria-busy', 'true');
  $('#main').innerHTML = LOADER;
}
function panelStatus(title, message, retry = false) {
  $('#main').removeAttribute('aria-busy');
  $('#main').innerHTML = `<section class="mod wide status-card" role="status"><h1>${esc(title)}</h1><p>${esc(message)}</p>
    ${retry ? '<button class="btn" id="retry">Tentar novamente</button>' : ''}</section>`;
  if (retry) $('#retry').onclick = boot;
}
function panelSignIn(expired = false) {
  if (expired) {
    panelKey = null;
    store.set('k', null);
  }
  lastFetch = 0;
  panelStatus('Entrar no Hélios Mercado', expired
    ? 'Confirme sua conta Google do trabalho para renovar o acesso.'
    : 'Use sua conta Google do trabalho para abrir o painel.');
  const link = document.createElement('a');
  link.className = 'btn';
  link.href = CONFIG.login;
  link.textContent = 'Entrar com Google';
  $('#main .status-card').append(link);
}
let bootStarted = Date.now();
async function boot() {
  if (busy) return;
  bootStarted = Date.now();
  readHash();
  shell();
  const q = new URLSearchParams(location.search);
  if (!$('#helios-gz').textContent.trim() && !q.has('demo') && !q.get('src') && !panelKey) return panelSignIn();
  busy = true;
  lastFetch = Date.now();
  panelLoading();
  try {
    const result = await fetchData(true);
    RAW = result?.data;
    DB = await model(RAW);
    pending = null;
    lastFetch = Date.now();
    failed = false;
    loadF();
    if (!DB.hasClosed) F.view = 'venda';
  } catch (error) {
    DB = null;
    if (error instanceof PanelAccessError) return panelSignIn(true);
    console.warn(error);
    panelStatus('Dados temporariamente indisponíveis', 'A consulta será repetida automaticamente enquanto o painel estiver aberto.', true);
    return;
  } finally {
    busy = false;
  }
  const opening = $('.helios-loader');
  if (opening) {
    const wait = 1350 - (Date.now() - bootStarted);
    if (wait > 0) await new Promise((resolve) => setTimeout(resolve, wait));
    document.body.append(opening);
  }
  shell();
  sentinelSize.disconnect();
  sentinelSize.observe($('#sentinelChart'));
  bindTheater();
  syncBar();
  render(false, true, () => { scrollToPanel(location.hash, 'instant'); leaveLoader(opening); });
}
function leaveLoader(el) {
  if (!el) return;
  el.classList.add('out');
  setTimeout(() => el.remove(), 760);
}
const checkData = () => DB ? refresh() : lastFetch ? boot() : undefined;
setInterval(() => { stampTick(); flush(); if (document.visibilityState === 'visible' && Date.now() - lastFetch >= CONFIG.refreshMin * 6e4) checkData(); }, 30000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  flush();
  if (Date.now() - lastFetch >= 6e4) checkData();
});
addEventListener('online', checkData);
addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeHelp(); if (!$$('details.dd[open]').length) setBubble(false); $$('details.dd[open]').forEach((d) => d.open = false); } });
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => DB && render(), 250); });
document.documentElement.dataset.mode = store.get('mode') === 'light' ? 'light' : 'dark';
boot();
</script>
