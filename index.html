<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios · Mercado</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Padrão Revenue: preto puro, grão sutil, Inter. Branco = nós (foco), cinza = concorrência, teal = ganho, vermelho = perda. */
:root {
  color-scheme: dark;
  --black: #000; --panel: #0b0b0b; --panel-2: #141414;
  --white: #f5f5f2; --muted: #8f8f8b; --faint: #55554f;
  --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.24);
  --red: #ec5a55; --teal: #4f9ea1; --red-dim: rgba(236,90,85,.18); --teal-dim: rgba(79,158,161,.18);
  --pos-text: var(--teal); --neg-text: var(--red);
  --us: var(--white); --them: #3a3a37; --them-2: #2a2a27; --them-hi: #6b6b66;
  --bar-bg: rgba(0,0,0,.86);
  --font: Inter, ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --pad: clamp(16px, 4.4vw, 72px);
  --ease: cubic-bezier(.16,1,.3,1);
}
:root[data-mode="light"] {
  color-scheme: light;
  --black: #f7f7f3; --panel: #fff; --panel-2: #efefea;
  --white: #151514; --muted: #6a6a65; --faint: #9c9c96;
  --line: rgba(0,0,0,.09); --line-strong: rgba(0,0,0,.2);
  --red-dim: rgba(236,90,85,.14); --teal-dim: rgba(79,158,161,.14);
  --pos-text: #377073; --neg-text: #c2443f;
  --them: #d5d5cf; --them-2: #e4e4de; --them-hi: #a9a9a3;
  --bar-bg: rgba(247,247,243,.9);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; min-height: 100vh; background: var(--black); color: var(--white); font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; overflow-x: clip; }
body::before { content: ""; position: fixed; inset: 0; z-index: 60; pointer-events: none; opacity: .03;
  background-image: repeating-radial-gradient(circle at 22% 18%, transparent 0, rgba(255,255,255,.42) .55px, transparent 1px, transparent 3px);
  background-size: 6px 7px; mix-blend-mode: soft-light; }
::selection { background: var(--white); color: var(--black); }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }
[hidden] { display: none !important; }
.eyebrow { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0; }
.wrap { padding-inline: var(--pad); }
.up { color: var(--pos-text); } .down { color: var(--neg-text); } .mut { color: var(--muted); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.up { background: var(--teal-dim); } .pill.down { background: var(--red-dim); } .pill.flat { background: var(--panel-2); color: var(--muted); }
.brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: .34em; font-size: 12px; text-transform: uppercase; }
.brand svg { height: 24px; width: auto; display: block; }
.btn { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line-strong); border-radius: 999px;
  padding: 8px 14px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; transition: background .25s, color .25s, border-color .25s; }
.btn:hover, .btn.pri { background: var(--white); color: var(--black); border-color: var(--white); }
.btn svg { width: 14px; height: 14px; }

/* entrada */
.start { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 24px var(--pad); }
.start-mid { align-self: center; justify-self: center; width: min(640px, 100%); text-align: center; }
.start-mid > svg { height: clamp(80px, 14vw, 130px); width: auto; margin-bottom: 30px; }
.start h1 { font-size: clamp(34px, 6vw, 64px); line-height: .98; letter-spacing: -.045em; font-weight: 600; margin: 0 0 14px; }
.start p { color: var(--muted); margin: 0 auto 26px; max-width: 46ch; }
.paste { display: flex; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 4px 4px 16px; margin: 0 auto 18px; max-width: 520px; }
.paste input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-size: 13px; }
.start small { color: var(--faint); font-size: 12px; }
.load { min-height: 100vh; display: grid; place-items: center; color: var(--muted); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.load i { display: block; width: 120px; height: 1px; background: var(--line); margin: 16px auto 0; overflow: hidden; position: relative; }
.load i::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--white); animation: slide 1.1s var(--ease) infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* topo */
.demo-bar { background: var(--white); color: var(--black); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; text-align: center; padding: 6px; }
.demo-bar button { background: none; border: 0; text-decoration: underline; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin-left: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding-block: 22px; }
.top .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stamp { font-size: 12px; color: var(--muted); }
.stamp b { color: var(--white); font-weight: 500; }
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: clamp(24px, 5vw, 80px); align-items: end; padding-block: clamp(26px, 5.5vw, 80px) clamp(22px, 3.6vw, 44px); }
.hero h1 { font-size: clamp(40px, 7vw, 104px); line-height: .93; letter-spacing: -.05em; font-weight: 600; margin: 14px 0 0; text-wrap: balance; }
.hero h1 span { display: block; color: var(--muted); font-weight: 500; font-size: .42em; letter-spacing: -.03em; line-height: 1.15; margin-top: 12px; }
.hero .lead { color: var(--muted); max-width: 46ch; margin: 0; font-size: 16px; }
.hero .lead b { color: var(--white); font-weight: 600; }
.verdict { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 12px; }
.verdict i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.verdict.up i { background: var(--teal); } .verdict.down i { background: var(--red); }

/* barra de filtros */
.bar { position: sticky; top: 0; z-index: 40; background: var(--bar-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-block: 1px solid var(--line); display: grid; gap: 10px; padding-block: 12px; }
.bar-row { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; min-width: 0; }
.bar .sp { flex: 1; }
.bar .k { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.chip { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--muted); transition: color .2s, background .2s, border-color .2s; white-space: nowrap; }
.chip:hover { color: var(--white); }
.chip[aria-pressed="true"] { background: var(--white); color: var(--black); border-color: var(--white); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 4px 11px; border-radius: 999px; font-size: 12px; color: var(--muted); white-space: nowrap; transition: background .2s, color .2s; }
.seg button:hover { color: var(--white); }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--black); }
select.sel { appearance: none; background: var(--black); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 30px 5px 12px; font-size: 12px; max-width: 60vw; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
input.date { background: var(--black); border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px 10px; font-size: 12px; color-scheme: inherit; }
.dd { position: relative; }
.dd > summary { list-style: none; cursor: pointer; }
.dd > summary::-webkit-details-marker { display: none; }
.dd[open] > summary:not([aria-pressed="true"]) { color: var(--white); border-color: var(--white); }
.pop { position: absolute; left: 0; top: calc(100% + 8px); z-index: 45; width: min(340px, 88vw); max-height: min(440px, 70vh); overflow: auto; padding: 8px;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,.45); }
.pop .grp { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 4px; display: flex; justify-content: space-between; }
.pop .grp button { background: none; border: 0; color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 0; }
.pop .grp button:hover { color: var(--white); }
.pop label { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.pop label:hover { background: var(--panel-2); }
.pop input[type=checkbox] { appearance: none; width: 14px; height: 14px; border: 1px solid var(--line-strong); border-radius: 4px; margin: 0; flex: none; display: grid; place-items: center; }
.pop input[type=checkbox]:checked { background: var(--white); border-color: var(--white); }
.pop input[type=checkbox]:checked::after { content: ""; width: 6px; height: 3px; border: 2px solid var(--black); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.pop label small { margin-left: auto; color: var(--faint); font-size: 11px; }
#prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--white); transform-origin: left; transform: scaleX(0); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kpi { padding: 28px 22px 28px 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.kpi + .kpi { border-left: 1px solid var(--line); padding-left: 22px; }
.kpi .v { font-size: clamp(28px, 3.6vw, 48px); font-weight: 600; letter-spacing: -.04em; line-height: 1.04; }
.kpi .v small { font-size: .42em; color: var(--muted); font-weight: 500; letter-spacing: 0; margin-left: 4px; }
.kpi .d { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.meter { position: relative; height: 4px; background: var(--them); border-radius: 2px; margin-top: 8px; overflow: visible; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--us); border-radius: 2px; transition: width .8s var(--ease); }
.meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--muted); }

/* módulos */
main { display: grid; padding-bottom: 40px; }
.mod { border-bottom: 1px solid var(--line); padding-block: clamp(36px, 5vw, 64px); display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr); gap: clamp(20px, 4vw, 64px); }
.mod-head { display: grid; gap: 12px; align-content: start; position: sticky; top: 128px; align-self: start; }
.mod-head h2 { font-size: clamp(22px, 2.4vw, 30px); line-height: 1.12; letter-spacing: -.03em; font-weight: 600; margin: 0; text-wrap: balance; }
.mod-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 40ch; }
.mod-body { display: grid; gap: 22px; min-width: 0; }
.insight { font-size: 18px; font-weight: 600; letter-spacing: -.015em; margin: 0; text-wrap: balance; line-height: 1.3; }
.insight em { font-style: normal; color: var(--muted); font-weight: 500; }
.note { font-size: 11px; color: var(--faint); margin: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend i.ln { height: 2px; vertical-align: 3px; border-radius: 0; width: 14px; }
.legend i.dash { height: 0; border-top: 2px dashed var(--muted); vertical-align: 3px; border-radius: 0; width: 14px; background: none !important; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
.two h4, .h4 { margin: 0 0 10px; font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 18px 0; border-top: 1px solid var(--line); }

/* barras horizontais e divergentes */
.hb { display: grid; gap: 3px; }
.hrow { display: grid; grid-template-columns: minmax(96px, 210px) minmax(0, 1fr) minmax(118px, auto); gap: 14px; align-items: center; min-height: 28px; transition: opacity .3s; }
.hb:hover .hrow:not(:hover) { opacity: .4; }
.hrow .nm { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hrow.us .nm { color: var(--white); font-weight: 500; }
.track { position: relative; height: 16px; }
.track .b { position: absolute; top: 0; bottom: 0; left: 0; background: var(--them-hi); border-radius: 0 3px 3px 0; transform-origin: left; animation: grow .8s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 25ms); }
.hrow.us .b { background: var(--us); }
.track .zero { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--line-strong); }
.track .b.pos { background: var(--teal); border-radius: 0 3px 3px 0; }
.track .b.neg { background: var(--red); border-radius: 3px 0 0 3px; transform-origin: right; }
.hrow .val { font-size: 12.5px; white-space: nowrap; display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
.hrow .val em { font-style: normal; color: var(--muted); }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes rise { from { transform: scaleY(0); } }

/* composição 100% */
.stack { display: flex; height: 22px; border-radius: 3px; overflow: hidden; gap: 2px; }
.stack i { display: block; height: 100%; background: var(--them); transition: filter .2s, opacity .2s; min-width: 1px; }
.stack i.us { background: var(--us); }
.stack i:nth-child(even):not(.us) { background: var(--them-2); }
.stack:hover i:not(:hover) { opacity: .55; }
.routes { display: grid; gap: 0; }
.rt { display: grid; grid-template-columns: minmax(120px, 1.1fr) minmax(0, 2.2fr) 74px 80px 64px; gap: 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rt .nm b { display: block; font-weight: 500; }
.rt .nm small { color: var(--muted); font-size: 11.5px; }
.rt .n { text-align: right; white-space: nowrap; }
.rt .n small { display: block; color: var(--muted); font-size: 11px; }
.rt.h { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); border-top: 0; padding-bottom: 4px; }

/* colunas */
.cols { display: flex; align-items: stretch; gap: 3px; height: 200px; }
.cols .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; cursor: default; }
.cols .seg2 { display: flex; flex-direction: column-reverse; gap: 2px; transform-origin: bottom; animation: rise .8s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 15ms); }
.cols .seg2 i { display: block; background: var(--them); border-radius: 0; }
.cols .seg2 i.us { background: var(--us); border-radius: 0 0 0 0; }
.cols .seg2 i:last-child { border-radius: 3px 3px 0 0; }
.cols .lbl { font-size: 10.5px; color: var(--faint); text-align: center; margin-top: 6px; height: 14px; overflow: hidden; white-space: nowrap; }
.cols .pct { font-size: 10px; color: var(--muted); text-align: center; margin-bottom: 4px; height: 13px; white-space: nowrap; overflow: hidden; }
.cols:hover .c:not(:hover) { opacity: .45; }
.cols .c { transition: opacity .25s; }

/* halteres */
.dumb { display: grid; }
.drow { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) minmax(96px, auto); gap: 14px; align-items: center; min-height: 34px; border-top: 1px solid var(--line); }
.drow .nm { font-size: 13px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dtrack { position: relative; height: 18px; }
.dtrack .ln { position: absolute; top: 8px; height: 2px; background: var(--line-strong); }
.dtrack .dot { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; transition: left .8s var(--ease); }
.dtrack .dot.us { background: var(--us); }
.dtrack .dot.them { background: var(--black); border: 1.5px solid var(--muted); }
.drow .val { font-size: 12.5px; white-space: nowrap; text-align: right; }
.drow.up .ln { background: var(--teal); } .drow.down .ln { background: var(--red); }
.axis { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) minmax(96px, auto); gap: 14px; font-size: 10px; color: var(--faint); }
.ticks { position: relative; height: 14px; } .ticks span { position: absolute; transform: translateX(-50%); }

/* linha */
.chart svg { display: block; overflow: visible; }
.chart text { fill: var(--faint); font-size: 10.5px; font-family: var(--font); }
.chart .grid { stroke: var(--line); }
.chart .path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.2s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* tabela */
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 12px; }
.search input { background: transparent; border: 0; outline: 0; width: 180px; max-width: 46vw; min-width: 0; font-size: 12px; }
.tbl-wrap { overflow: auto; max-height: 640px; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 9px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { position: sticky; top: 0; z-index: 1; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; background: var(--panel); }
th[aria-sort] { color: var(--white); }
th[aria-sort="ascending"]::after { content: " ↑"; } th[aria-sort="descending"]::after { content: " ↓"; }
tbody tr:hover td { background: var(--panel-2); }
tr.us td:nth-child(2) { font-weight: 600; }
.minibar { display: inline-block; width: 54px; height: 4px; background: var(--them); border-radius: 2px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.minibar i { display: block; height: 100%; background: var(--us); }

footer { padding-block: 36px 60px; color: var(--muted); font-size: 12.5px; display: grid; grid-template-columns: minmax(0, 270px) minmax(0, 1fr); gap: clamp(20px, 4vw, 64px); }
footer ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 86ch; }
footer b { color: var(--white); font-weight: 500; }

#tip { position: fixed; z-index: 80; pointer-events: none; background: var(--panel); color: var(--white); border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 11px;
  font-size: 12px; line-height: 1.45; box-shadow: 0 14px 40px rgba(0,0,0,.45); max-width: 300px; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; white-space: pre-line; }
#tip.on { opacity: 1; transform: none; }
#tip b { font-weight: 600; }

@media (max-width: 980px) {
  .hero { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .mod, footer { grid-template-columns: minmax(0, 1fr); }
  .mod-head { position: static; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(3) { border-left: 0; padding-left: 0; }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
  .two { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .hrow { grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) auto; gap: 8px; }
  .rt { grid-template-columns: minmax(0, 1fr) 64px 60px; }
  .rt .stk, .rt .p3 { display: none; }
  .drow, .axis { grid-template-columns: 90px minmax(0, 1fr) auto; gap: 8px; }
  .cols { height: 160px; gap: 2px; } .cols .pct { display: none; }
  .bar { gap: 8px; position: static; } .bar .k { display: none; } .mod-head { top: 0; }

<body>
<script id="helios-gz" type="text/plain"></script>

<script>
'use strict';
/* ======================================================================
   Helios · Mercado — parcela de passageiros (poltronas ocupadas) por linha.
   Fonte: API do Helios (Apps Script). Sem dependências.
   ====================================================================== */
const CONFIG = {
  api: '',          // endereço /exec do App da Web do Helios (o link do menu também traz)

};

const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const store = {get: (k) => { try { return localStorage.getItem('helios.' + k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem('helios.' + k) : localStorage.setItem('helios.' + k, v); } catch {} }};

/* ---------- formatos ---------- */
const NF0 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits: 0});
const NF1 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const BRL = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL', maximumFractionDigits: 0});
const n0 = (v) => Number.isFinite(v) ? NF0.format(v) : '—';
const pct = (v, d = 1) => Number.isFinite(v) ? (d ? NF1.format(v * 100) : NF0.format(v * 100)) + '%' : '—';
const pp = (v) => Number.isFinite(v) ? (v > 0 ? '+' : v < 0 ? '−' : '±') + NF1.format(Math.abs(v * 100)) + ' p.p.' : '—';

const sgn = (v) => (v > 0 ? '+' : v < 0 ? '−' : '±') + NF0.format(Math.abs(v));
const cls = (v, eps = 1e-9) => v > eps ? 'up' : v < -eps ? 'down' : 'flat';
const compact = (v) => !Number.isFinite(v) ? '—' : Math.abs(v) >= 1e6 ? NF1.format(v / 1e6) + ' mi' : Math.abs(v) >= 1e4 ? NF1.format(v / 1e3) + ' mil' : NF0.format(v);

const WD = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const WDL = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const ms = (d) => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));

const brY = (d) => d ? `${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(2, 4)}` : '—';

const shortRoute = (l) => String(l).replace(/São Paulo/g, 'SP').replace(/Rio de Janeiro/g, 'Rio').replace(/Florianópolis/g, 'Floripa').replace(/Belo Horizonte/g, 'BH').replace(/São José do Rio Preto/g, 'Rio Preto');
const HOURS = [{k: 'mad', l: 'Madrugada', a: 0, b: 5}, {k: 'man', l: 'Manhã', a: 6, b: 11}, {k: 'tar', l: 'Tarde', a: 12, b: 17}, {k: 'noi', l: 'Noite', a: 18, b: 23}];

/* ---------- dados ---------- */
let RAW = null, DB = null;
async function gunzip64(b64) {
  const bin = Uint8Array.from(atob(b64.replace(/\s+/g, '')), (c) => c.charCodeAt(0));
  const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('k')) store.set('k', h.get('k'));
  if (h.get('api')) store.set('api', h.get('api'));
  if (h.get('k') || h.get('api')) history.replaceState(null, '', location.pathname + location.search);
}
const apiUrl = () => store.get('api') || CONFIG.api;
async function fetchData() {
  const embedded = $('#helios-gz').textContent.trim();
  if (embedded) return gunzip64(embedded);
  const q = new URLSearchParams(location.search);
  if (q.has('demo') || store.get('demo') === '1') { const r = await fetch(q.get('src') || 'demo.json', {cache: 'no-cache'}); return r.json(); }
  if (q.get('src')) { const r = await fetch(q.get('src'), {cache: 'no-cache'}); return r.json(); }
  const k = store.get('k'), api = apiUrl();
  if (!k || !api) return null;
  const gz = !!window.DecompressionStream;
  const r = await fetch(`${api}?fmt=${gz ? 'gz' : 'json'}&dias=${CONFIG.dias}&k=${encodeURIComponent(k)}`, {cache: 'no-store', redirect: 'follow'});
  if (!r.ok) throw new Error(`A API respondeu ${r.status}.`);
  const text = await r.text();
  const data = gz && !text.trim().startsWith('{') ? await gunzip64(text) : JSON.parse(text);
  if (!data.ok) throw new Error(data.erro || 'Resposta inválida da API.');
  return data;
}
function model(data) {
  const dims = data.dims;
  const jca = dims.viacoes.map((v) => v.g === 'JCA');
  const rows = data.viagens.rows.map((r) => ({d: r[0], r: r[1], v: r[2], c: r[3], h: r[4], n: r[5], cap: r[6], pax: r[7], pax1: r[8], rec: r[9], open: r[10], wd: wdOf(r[0]), j: jca[r[2]]}));
  const sales = (data.vendas?.rows || []).map((s) => ({d: s[0], r: s[1], v: s[2], c: s[3], a: s[4], pax: s[5], rec: s[6], wd: wdOf(s[0]), j: jca[s[2]]}));
  const closed = rows.filter((r) => !r.open).map((r) => r.d);
  const lastClosed = closed.length ? closed.reduce((a, b) => a > b ? a : b) : addD(data.hoje, -1);
  const firstDay = rows.length ? rows.reduce((a, r) => a < r.d ? a : r.d, '9999') : lastClosed;
  const markets = [...new Set(dims.rotas.map((r) => r.m))];
  return {data, dims, jca, rows, sales, lastClosed, firstDay, today: data.hoje, markets};
}

/* ---------- filtros ---------- */
const F = {per: '30', from: '', to: '', cmp: true, view: 'real', routes: new Set(), classes: new Set(), hours: new Set(), wds: new Set(), focus: 'JCA', group: true, mode: 'dir'};
function loadF() {
  try { const s = JSON.parse(store.get('f') || '{}');
    for (const k of ['per', 'from', 'to', 'cmp', 'view', 'focus', 'group', 'mode']) if (s[k] !== undefined) F[k] = s[k];
    for (const k of ['routes', 'classes', 'hours', 'wds']) if (Array.isArray(s[k])) F[k] = new Set(s[k]);
  } catch {}
}
function saveF() { store.set('f', JSON.stringify({...F, routes: [...F.routes], classes: [...F.classes], hours: [...F.hours], wds: [...F.wds]})); }
function ranges() {
  if (F.view === 'venda') { const a = DB.today, b = addD(DB.today, 14); return {a, b, pa: null, pb: null, len: 15}; }
  const end = DB.lastClosed; let a, b = end;
  if (F.per === 'mes') a = end.slice(0, 8) + '01';
  else if (F.per === 'custom' && F.from && F.to) { a = F.from <= F.to ? F.from : F.to; b = F.from <= F.to ? F.to : F.from; }
  else a = addD(end, -(Number(F.per) || 30) + 1);
  if (b > end) b = end;
  const len = diffD(b, a) + 1;
  return {a, b, pa: addD(a, -len), pb: addD(a, -1), len};
}
const hourOk = (h) => !F.hours.size || HOURS.some((x) => F.hours.has(x.k) && h >= x.a && h <= x.b);
const dimOk = (r) => (!F.routes.size || F.routes.has(r.r)) && (!F.classes.size || F.classes.has(r.c)) && (!F.wds.size || F.wds.has(r.wd));
function isUs(r) { return F.focus === 'JCA' ? r.j : r.v === Number(F.focus); }
const focusName = () => F.focus === 'JCA' ? 'Grupo JCA' : DB.dims.viacoes[Number(F.focus)]?.n || '—';
const focusShort = () => F.focus === 'JCA' ? 'JCA' : focusName();
function pick(a, b, open) { if (!a) return []; return DB.rows.filter((r) => r.open === open && r.d >= a && r.d <= b && dimOk(r) && hourOk(r.h)); }

/* ---------- contas ---------- */
function tot(list) { const t = {pax: 0, cap: 0, n: 0, rec: 0, upax: 0, ucap: 0, un: 0, urec: 0, pax1: 0, upax1: 0};
  for (const r of list) { t.pax += r.pax; t.cap += r.cap; t.n += r.n; t.rec += r.rec; t.pax1 += r.pax1;
    if (isUs(r)) { t.upax += r.pax; t.ucap += r.cap; t.un += r.n; t.urec += r.rec; t.upax1 += r.pax1; } }
  t.share = t.pax ? t.upax / t.pax : NaN; t.fair = t.cap ? t.ucap / t.cap : NaN; t.idx = t.share / t.fair;
  t.lfUs = t.ucap ? t.upax / t.ucap : NaN; t.lfThem = t.cap - t.ucap ? (t.pax - t.upax) / (t.cap - t.ucap) : NaN;
  t.them = t.pax - t.upax; return t; }
const groupBy = (a, f) => { const m = new Map(); for (const x of a) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; };
function companyKey(r) { return F.group && r.j && F.focus === 'JCA' ? 'JCA' : String(r.v); }
function companyName(k) { return k === 'JCA' ? 'Grupo JCA' : DB.dims.viacoes[Number(k)].n; }
function companyIsUs(k) { return k === 'JCA' ? true : F.focus === 'JCA' ? DB.jca[Number(k)] : Number(k) === Number(F.focus); }

/* ---------- peças visuais ---------- */
const tipAttr = (t) => ` data-tip="${esc(t)}"`;
function hbars(items, {max, val, right, tip, us}) {
  if (!items.length) return '<div class="empty">Sem dados para os filtros escolhidos.</div>';
  const mx = max ?? Math.max(...items.map(val), 0);
  return `<div class="hb">${items.map((it, i) => { const v = val(it); const w = mx > 0 ? Math.max(.4, v / mx * 100) : 0;
    return `<div class="hrow${us(it) ? ' us' : ''}"${tipAttr(tip(it))}><div class="nm">${esc(it.name)}</div><div class="track"><div class="b" style="width:${w}%;--i:${i}"></div></div><div class="val">${right(it)}</div></div>`; }).join('')}</div>`;
}
function divbars(items, {val, right, tip, us}) {
  if (!items.length) return '<div class="empty">Sem dados para comparar.</div>';
  const mx = Math.max(...items.map((x) => Math.abs(val(x))), 1e-9);
  const neg = items.some((x) => val(x) < 0), pos = items.some((x) => val(x) > 0);
  const z = neg && pos ? 50 : neg ? 100 : 0; const span = neg && pos ? 50 : 100;
  return `<div class="hb">${items.map((it, i) => { const v = val(it); const w = Math.abs(v) / mx * span;
    const st = v >= 0 ? `left:${z}%;width:${w}%` : `left:${z - w}%;width:${w}%`;
    return `<div class="hrow${us && us(it) ? ' us' : ''}"${tipAttr(tip(it))}><div class="nm">${esc(it.name)}</div><div class="track"><div class="zero" style="left:${z}%"></div><div class="b ${v >= 0 ? 'pos' : 'neg'}" style="${st};--i:${i}"></div></div><div class="val">${right(it)}</div></div>`; }).join('')}</div>`;
}
function columns(items, {label, us, them, tip, top}) {
  if (!items.length) return '<div class="empty">Sem dados.</div>';
  const mx = Math.max(...items.map((x) => us(x) + them(x)), 1e-9);
  return `<div class="cols">${items.map((it, i) => { const a = us(it), b = them(it); const H = 150;
    return `<div class="c"${tipAttr(tip(it))}><div class="pct">${top ? top(it) : ''}</div><div class="seg2" style="--i:${i}"><i class="us" style="height:${a / mx * H}px"></i><i style="height:${b / mx * H}px"></i></div><div class="lbl">${esc(label(it))}</div></div>`; }).join('')}</div>`;
}
/** Linhas (uma escala só). series: [{name, color, dash, values:[n|null]}]; tip(i) → texto. */
function lineSvg(id, xs, series, {yFmt, xFmt, tip, y0, y1}) {
  const el = document.getElementById(id); if (!el) return;
  const W = Math.max(320, el.clientWidth || 640), H = 250, L = 46, R = 12, T = 12, B = 28;
  const vals = series.flatMap((s) => s.values).filter(Number.isFinite);
  if (!vals.length || xs.length < 2) { el.innerHTML = '<div class="empty">Poucos dias para desenhar a curva.</div>'; return; }
  let lo = y0 ?? Math.min(...vals), hi = y1 ?? Math.max(...vals); const pad = (hi - lo) * .12 || .05; if (y0 == null) lo = Math.max(0, lo - pad); if (y1 == null) hi += pad;
  const X = (i) => L + i / (xs.length - 1) * (W - L - R), Y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = lo + (hi - lo) * k / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 3.5}" text-anchor="end">${esc(yFmt(v))}</text>`; }
  const step = Math.max(1, Math.ceil(xs.length / Math.max(4, Math.floor(W / 80))));
  xs.forEach((x, i) => { if (i % step === 0) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${esc(xFmt(x))}</text>`; });
  const paths = series.map((s) => { let d = '', pen = false;
    s.values.forEach((v, i) => { if (!Number.isFinite(v)) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    return `<path class="path${s.dash ? '' : ' draw'}" d="${d}" stroke="${s.color}" ${s.dash ? 'stroke-dasharray="5 5" opacity=".8"' : ''} pathLength="1000" style="--len:1000"/>`; }).join('');
  const lastPts = series.filter((s) => !s.dash).map((s) => { const i = s.values.length - 1; return Number.isFinite(s.values[i]) ? `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4" fill="${s.color}" stroke="var(--black)" stroke-width="2"/>` : ''; }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">${g}${paths}${lastPts}<line class="xh" y1="${T}" y2="${H - B}" stroke="var(--line-strong)" visibility="hidden"/><g class="dots"></g><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), dots = svg.querySelector('.dots');
  svg.addEventListener('mousemove', (e) => { const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(xs.length - 1, Math.round((x - L) / (W - L - R) * (xs.length - 1))));
    xh.setAttribute('x1', X(i)); xh.setAttribute('x2', X(i)); xh.setAttribute('visibility', 'visible');
    dots.innerHTML = series.map((s) => Number.isFinite(s.values[i]) ? `<circle cx="${X(i)}" cy="${Y(s.values[i])}" r="4.5" fill="${s.color}" stroke="var(--black)" stroke-width="2"/>` : '').join('');
    showTip(tip(i), e.clientX, e.clientY); });
  svg.addEventListener('mouseleave', () => { xh.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; hideTip(); });
}
function stack100(parts, total) {
  return `<div class="stack">${parts.map((p) => `<i class="${p.us ? 'us' : ''}" style="width:${p.v / total * 100}%"${tipAttr(`${p.name}\n${n0(p.v)} passageiros · ${pct(p.v / total)}`)}></i>`).join('')}</div>`;
}
const deltaPill = (v, f = pp) => Number.isFinite(v) ? `<span class="pill ${cls(v, 5e-4)}">${f(v)}</span>` : '';

/* ---------- tooltip ---------- */
const tipEl = () => $('#tip');
function showTip(text, x, y) { const t = tipEl(); t.textContent = text; t.classList.add('on'); const w = t.offsetWidth, h = t.offsetHeight;
  let l = x + 16, tp = y + 16; if (l + w > innerWidth - 10) l = x - w - 16; if (tp + h > innerHeight - 10) tp = y - h - 16; t.style.left = l + 'px'; t.style.top = tp + 'px'; }

document.addEventListener('mousemove', (e) => { if (e.target.closest?.('svg rect')) return; const t = e.target.closest?.('[data-tip]'); if (t) showTip(t.dataset.tip, e.clientX, e.clientY); else if (!e.target.closest?.('.chart')) hideTip(); });
document.addEventListener('scroll', hideTip, {passive: true});

function buildBar() {

  <div class="bar-row">
    <div class="seg" id="viewS"><button data-v="real">Realizado</button><button data-v="venda">Em venda · próx. 14 dias</button></div>
    <span class="k">Período</span>

const afterRender = [];
const mod = (title, text, body) => `<section class="mod"><div class="mod-head"><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}</div><div class="mod-body">${body}</div></section>`;

/* 1 · para onde foram */
function modWhere(T, P, cur, prev) {
  if (!P || !P.pax) return mod('Para onde foram os passageiros', 'Ligue “Comparar com período anterior” para ver ganhos e perdas.', '<div class="empty">Sem período anterior com dados.</div>');

  const parts = [{name: 'Tamanho do mercado', v: effMkt, t: `Se a parcela fosse a mesma do período anterior (${pct(P.share)}), a variação do mercado (${dpct(T.pax / P.pax - 1)}) daria ${sgn(effMkt)} passageiros.`},
    {name: 'Parcela (concorrência)', v: effShr, t: `Efeito da mudança de parcela (${pp(T.share - P.share)}) sobre o mercado atual: ${sgn(effShr)} passageiros.`},
    {name: `Total ${us}`, v: d, t: `${n0(P.upax)} → ${n0(T.upax)} passageiros (${sgn(d)}).`, us: 1}];
  const a = groupBy(cur, companyKey), b = groupBy(prev, companyKey);

  const sumP = (l) => (l || []).reduce((n, r) => n + r.pax, 0);
  const movers = [...keys].map((k) => { const x = sumP(a.get(k)), y = sumP(b.get(k)); return {k, name: companyName(k), v: x - y, x, y, s: x / T.pax, sp: y / P.pax}; })
    .filter((m) => Math.abs(m.v) >= .5 && !companyIsUs(m.k)).sort((p, q) => q.v - p.v);
  const top = movers.length > 14 ? [...movers.slice(0, 7), ...movers.slice(-7)] : movers;
  const gain = movers.filter((m) => !companyIsUs(m.k) && m.s - m.sp > 0).sort((p, q) => (q.s - q.sp) - (p.s - p.sp))[0];

/* 3 · ranking */

/* 4 · linha a linha */

  const worst = rows.filter((r) => Number.isFinite(r.ds)).sort((x, y) => x.ds - y.ds)[0];
  const best = rows.filter((r) => Number.isFinite(r.ds)).sort((x, y) => y.ds - x.ds)[0];
  return mod('Linha a linha', `Composição dos passageiros em cada ${F.mode === 'mkt' ? 'mercado' : 'sentido'}: branco = ${esc(us)}, cinza = cada concorrente. Passe o mouse nas fatias.`,
    `<div class="tools"><div class="seg" id="modeS"><button data-m="dir" aria-pressed="${F.mode === 'dir'}">Por sentido</button><button data-m="mkt" aria-pressed="${F.mode === 'mkt'}">Por mercado</button></div></div>
    ${worst && best && worst !== best ? `<p class="insight">Maior perda de parcela: <em>${esc(shortRoute(worst.k))} (${pp(worst.ds)})</em>. Maior ganho: <em>${esc(shortRoute(best.k))} (${pp(best.ds)})</em>.</p>` : ''}
    <div class="routes"><div class="rt h"><span>Linha</span><span class="stk">Composição</span><span class="n">Parcela</span><span class="n p3">Variação</span><span class="n">Ocupação</span></div>
    ${rows.map((x) => `<div class="rt"${tipAttr(`${x.k}\nMercado: ${n0(x.t.pax)} passageiros · ${us}: ${n0(x.t.upax)}\nParcela ${pct(x.t.share)} · oferta ${pct(x.t.fair)}${x.p ? `\nAntes: parcela ${pct(x.p.share)} · mercado ${n0(x.p.pax)}` : ''}\nOcupação ${us} ${pct(x.t.lfUs, 0)} × concorrência ${pct(x.t.lfThem, 0)}`)}>
      <div class="nm"><b>${esc(shortRoute(x.k))}</b><small>${n0(x.t.pax)} passageiros</small></div><div class="stk">${stack100(x.comp, x.t.pax)}</div>
      <div class="n"><b>${pct(x.t.share)}</b><small>oferta ${pct(x.t.fair, 0)}</small></div><div class="n p3">${deltaPill(x.ds) || '<span class="mut">—</span>'}</div>
      <div class="n">${pct(x.t.lfUs, 0)}<small>conc. ${pct(x.t.lfThem, 0)}</small></div></div>`).join('') || '<div class="empty">Sem dados.</div>'}</div>`);
}

/* 5 · horário e dia da semana */
function modWhen(cur) {
  const us = focusShort();
  const byH = groupBy(cur, (r) => r.h), byW = groupBy(cur, (r) => r.wd);
  const hrs = [...Array(24).keys()].map((h) => ({h, t: tot(byH.get(h) || [])}));
  const wds = [1, 2, 3, 4, 5, 6, 0].map((w) => ({w, t: tot(byW.get(w) || [])}));
  const bestH = hrs.filter((x) => x.t.pax > 20).sort((a, b) => b.t.share - a.t.share);
  const ins = bestH.length > 3 ? `Mais forte às <em>${bestH[0].h}h (${pct(bestH[0].t.share, 0)})</em>, mais fraca às <em>${bestH[bestH.length - 1].h}h (${pct(bestH[bestH.length - 1].t.share, 0)})</em>.` : '';
  return mod('Horário e dia da semana', `Passageiros por hora de partida e por dia da viagem. Branco = ${esc(us)}. O número em cima é a parcela.`,
    `${ins ? `<p class="insight">${ins}</p>` : ''}
    ${columns(hrs, {label: (x) => x.h % 3 === 0 ? x.h + 'h' : '', us: (x) => x.t.upax, them: (x) => x.t.them, top: (x) => x.t.pax ? pct(x.t.share, 0) : '',
      tip: (x) => `Partidas das ${x.h}h\n${us}: ${n0(x.t.upax)} · concorrência: ${n0(x.t.them)}\nParcela ${pct(x.t.share)} · oferta ${pct(x.t.fair)}\nOcupação ${pct(x.t.lfUs, 0)} × ${pct(x.t.lfThem, 0)}`})}
    <div><p class="h4">Dia da semana da viagem</p>${columns(wds, {label: (x) => WD[x.w], us: (x) => x.t.upax, them: (x) => x.t.them, top: (x) => x.t.pax ? pct(x.t.share, 0) : '',
      tip: (x) => `${WDL[x.w]}\n${us}: ${n0(x.t.upax)} · concorrência: ${n0(x.t.them)}\nParcela ${pct(x.t.share)}`})}</div>`);
}

/* 6 · ocupação */
function modOcc(cur) {
  const us = focusShort();
  const by = groupBy(cur, (r) => DB.dims.rotas[r.r].l);
  const rows = [...by.entries()].map(([k, l]) => ({k, t: tot(l)})).filter((x) => x.t.ucap > 0 && x.t.cap - x.t.ucap > 0).sort((a, b) => (b.t.lfUs - b.t.lfThem) - (a.t.lfUs - a.t.lfThem));
  if (!rows.length) return mod('Ocupação: nós × concorrência', '', '<div class="empty">Sem linhas com as duas partes no recorte.</div>');
  const ticks = [0, .25, .5, .75, 1];
  return mod('Ocupação: nós × concorrência', `Ponto branco = ocupação de ${esc(us)}, círculo vazio = média da concorrência na mesma linha. Ocupação alta com parcela baixa = falta oferta, não procura.`,
    `<div class="dumb"><div class="axis"><span></span><div class="ticks">${ticks.map((t) => `<span style="left:${t * 100}%">${pct(t, 0)}</span>`).join('')}</div><span></span></div>
    ${rows.map((x) => { const a = Math.min(1, x.t.lfUs), b = Math.min(1, x.t.lfThem); const lo = Math.min(a, b), hi = Math.max(a, b); const d = x.t.lfUs - x.t.lfThem;
      return `<div class="drow ${cls(d, .005)}"${tipAttr(`${x.k}\nOcupação ${us}: ${pct(x.t.lfUs)} (${n0(x.t.upax)} de ${n0(x.t.ucap)} poltronas)\nConcorrência: ${pct(x.t.lfThem)} (${n0(x.t.them)} de ${n0(x.t.cap - x.t.ucap)})`)}>
        <div class="nm">${esc(shortRoute(x.k))}</div><div class="dtrack"><div class="ln" style="left:${lo * 100}%;width:${(hi - lo) * 100}%"></div><div class="dot them" style="left:${b * 100}%"></div><div class="dot us" style="left:${a * 100}%"></div></div>
        <div class="val"><b>${pct(x.t.lfUs, 0)}</b> <span class="mut">× ${pct(x.t.lfThem, 0)}</span></div></div>`; }).join('')}</div>`);
}

/* 7 · próximos dias (sempre em venda) */
function modAhead() {
  const list = pick(DB.today, addD(DB.today, 14), 1);
  if (!list.length) return mod('Próximos 14 dias', '', '<div class="empty">Sem viagens à venda no recorte.</div>');
  const us = focusShort(); const T = tot(list);
  const by = groupBy(list, (r) => r.d);
  const days = []; for (let d = DB.today; d <= addD(DB.today, 14); d = addD(d, 1)) days.push(d);
  const pts = days.map((d) => ({d, t: tot(by.get(d) || [])}));
  return mod('Próximos 14 dias', `Poltronas já vendidas para as viagens que ainda vão sair. Antecipa a tendência antes de virar realizado.`,
    `<p class="insight">${esc(us)} tem <em>${pct(T.share)}</em> do que já foi vendido para os próximos 14 dias (${n0(T.upax)} de ${n0(T.pax)} poltronas).</p>
    ${columns(pts, {label: (x) => x.d === DB.today ? 'hoje' : `${WD[wdOf(x.d)]} ${x.d.slice(8)}`, us: (x) => x.t.upax, them: (x) => x.t.them, top: (x) => x.t.pax ? pct(x.t.share, 0) : '',
      tip: (x) => `${WDL[wdOf(x.d)]} ${br(x.d)}${x.d === DB.today ? ' (hoje)' : ` · D-${diffD(x.d, DB.today)}`}\n${us}: ${n0(x.t.upax)} · concorrência: ${n0(x.t.them)}\nParcela ${pct(x.t.share)} · ocupação ${pct(x.t.lfUs, 0)} × ${pct(x.t.lfThem, 0)}`})}`);
}

/* 8 · ritmo de compra */
function modPace() {
  const S = DB.sales.filter((s) => (!F.routes.size || F.routes.has(s.r)) && (!F.classes.size || F.classes.has(s.c)));
  if (!S.length) return mod('Ritmo de compra', '', '<div class="empty">Ainda sem vendas detectadas.</div>');
  const last = S.reduce((a, s) => a > s.d ? a : s.d, '');
  const days = []; for (let d = addD(last, -29); d <= last; d = addD(d, 1)) days.push(d);
  const by = groupBy(S, (s) => s.d);
  const pts = days.map((d) => { const l = by.get(d) || []; let u = 0, t = 0; for (const s of l) { t += s.pax; if (isUs(s)) u += s.pax; } return {d, u, t, them: t - u}; });
  const us = focusShort();
  const half = (arr) => arr.reduce((n, x) => n + x.t, 0);
  const a = half(pts.slice(-7)), b = half(pts.slice(-14, -7));
  const ua = pts.slice(-7).reduce((n, x) => n + x.u, 0), ub = pts.slice(-14, -7).reduce((n, x) => n + x.u, 0);
  const leadL = ['no dia', 'na véspera', '2–3 dias antes', '4–7 dias antes', '8+ dias antes'];
  const byA = groupBy(S.filter((s) => s.d > addD(last, -14)), (s) => s.a);
  const mix = [0, 1, 2, 3, 4].map((k) => { const l = byA.get(k) || []; let u = 0, t = 0; for (const s of l) { t += s.pax; if (isUs(s)) u += s.pax; } return {name: leadL[k], u, t}; });
  return mod('Ritmo de compra', `Poltronas que o Helios viu sair do estoque a cada dia (dia da compra, não da viagem). Mostra se os passageiros estão comprando — e onde.`,
    `<p class="insight">Últimos 7 dias: mercado <em>${dpct(b ? a / b - 1 : NaN)}</em>, ${esc(us)} <em>${dpct(ub ? ua / ub - 1 : NaN)}</em> contra a semana anterior.</p>
    ${columns(pts, {label: (x) => days.indexOf(x.d) % 5 === 0 ? br(x.d) : '', us: (x) => x.u, them: (x) => x.them,
      tip: (x) => `Compras em ${WDL[wdOf(x.d)].toLowerCase()} ${br(x.d)}\n${us}: ${n0(x.u)} · concorrência: ${n0(x.them)}\nParcela das compras ${pct(x.t ? x.u / x.t : NaN)}`})}
    <div><p class="h4">Com quanta antecedência compram · últimos 14 dias</p>
    ${hbars(mix, {val: (x) => x.t, us: () => false, right: (x) => `${n0(x.t)} <em>${esc(us)} ${pct(x.t ? x.u / x.t : NaN, 0)}</em>`, tip: (x) => `Compras ${x.name}\nMercado ${n0(x.t)} · ${us} ${n0(x.u)} (${pct(x.t ? x.u / x.t : NaN)})`})}</div>`);
}

/* 9 · tabela */
let tSort = {k: 'pax', d: -1}, tQ = '';
function tableRows(cur, prev) {
  const key = (r) => r.r + '|' + companyKey(r);
  const a = groupBy(cur, key), b = groupBy(prev, key);
  const mkt = new Map(), mktP = new Map();
  for (const r of cur) mkt.set(r.r, (mkt.get(r.r) || 0) + r.pax);
  for (const r of prev) mktP.set(r.r, (mktP.get(r.r) || 0) + r.pax);
  return [...a.entries()].map(([k, l]) => { const [ri, ck] = k.split('|'); const t = tot(l); const y = (b.get(k) || []).reduce((n, r) => n + r.pax, 0);
    const s = t.pax / (mkt.get(Number(ri)) || 1), sp = mktP.get(Number(ri)) ? y / mktP.get(Number(ri)) : NaN;
    return {route: shortRoute(DB.dims.rotas[ri].l), co: companyName(ck), us: companyIsUs(ck), pax: t.pax, s, ds: s - sp, cap: t.cap, n: t.n, lf: t.cap ? t.pax / t.cap : NaN, rec: t.rec, tk: t.pax ? t.rec / t.pax : NaN}; });
}
const TCOLS = [['route', 'Linha'], ['co', 'Viação'], ['pax', 'Passageiros'], ['s', 'Parcela na linha'], ['ds', 'Variação'], ['n', 'Ônibus'], ['cap', 'Poltronas'], ['lf', 'Ocupação'], ['tk', 'Tíquete médio'], ['rec', 'Receita est.']];
function modTable(cur, prev) {
  let rows = tableRows(cur, prev); const q = tQ.toLowerCase();
  if (q) rows = rows.filter((r) => (r.route + ' ' + r.co).toLowerCase().includes(q));
  rows.sort((x, y) => { const a = x[tSort.k], b = y[tSort.k]; return (typeof a === 'string' ? a.localeCompare(b, 'pt-BR') : (Number.isFinite(a) ? a : -Infinity) - (Number.isFinite(b) ? b : -Infinity)) * tSort.d; });
  window.__rows = rows;
  const fmt = {pax: (r) => n0(r.pax), s: (r) => `<span class="minibar"><i style="width:${Math.min(100, r.s * 100)}%"></i></span>${pct(r.s)}`, ds: (r) => prev.length && Number.isFinite(r.ds) ? deltaPill(r.ds) : '—',
    n: (r) => n0(r.n), cap: (r) => n0(r.cap), lf: (r) => pct(r.lf, 0), tk: (r) => money(r.tk), rec: (r) => money(r.rec), route: (r) => esc(r.route), co: (r) => esc(r.co)};
  return mod('Tudo em tabela', 'Linha × viação no recorte. Clique no título da coluna para ordenar.',
    `<div class="tools"><label class="search"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="tq" placeholder="Buscar linha ou viação" value="${esc(tQ)}"></label><span class="sp" style="flex:1"></span><button class="btn" id="csvB">Exportar CSV</button></div>
    <div class="tbl-wrap"><table><thead><tr>${TCOLS.map(([k, l]) => `<th data-k="${k}"${tSort.k === k ? ` aria-sort="${tSort.d > 0 ? 'ascending' : 'descending'}"` : ''}>${l}</th>`).join('')}</tr></thead>
    <tbody>${rows.slice(0, 400).map((r) => `<tr class="${r.us ? 'us' : ''}">${TCOLS.map(([k]) => `<td>${fmt[k](r)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${TCOLS.length}" class="mut">Sem dados.</td></tr>`}</tbody></table></div>
    ${rows.length > 400 ? `<p class="note">Mostrando 400 de ${n0(rows.length)} — use a busca ou exporte.</p>` : ''}`);
}
function bindTable() {
  $$('th[data-k]').forEach((th) => th.onclick = () => { const k = th.dataset.k; tSort = {k, d: tSort.k === k ? -tSort.d : (k === 'route' || k === 'co' ? 1 : -1)}; render(); });
  const q = $('#tq'); if (q) q.oninput = () => { tQ = q.value; const p = q.selectionStart; render(); const n = $('#tq'); n.focus(); n.setSelectionRange(p, p); };
  const c = $('#csvB'); if (c) c.onclick = () => {
    const cell = (v) => v == null || (typeof v === 'number' && !Number.isFinite(v)) ? '' : typeof v === 'number' ? String(Math.round(v * 10000) / 10000).replace('.', ',') : `"${String(v).replace(/"/g, '""')}"`;
    const lines = [TCOLS.map((c) => c[1]).join(';'), ...window.__rows.map((r) => TCOLS.map(([k]) => cell(r[k])).join(';'))];
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
    const {a: d0, b: d1} = ranges(); a.download = `helios_mercado_${d0}_${d1}.csv`; a.click(); URL.revokeObjectURL(a.href); };
  const m = $('#modeS'); if (m) m.onclick = (e) => { const b = e.target.closest('button'); if (b) { F.mode = b.dataset.m; saveF(); render(); } };
}

/* ---------- partida ---------- */
let timer = 0;
async function boot(force) {
  readHash();
  if (!DB || force) {
    if (!DB) $('#app').innerHTML = '<div class="load"><div>Helios · carregando mercado<i></i></div></div>';
    else $('#reload').textContent = 'Buscando…';
    try { RAW = await fetchData(); }
    catch (e) { console.error(e); if (!DB) return startScreen(`Não consegui ler a API: ${e.message} Confira o link (menu Helios → Painel web).`); $('#reload').textContent = 'Falhou · tentar'; return; }
    if (!RAW) return startScreen();
    const keep = !!DB; DB = model(RAW);
    if (!keep) { loadF(); shell(); }
  }
  syncBar(); render();
  clearInterval(timer);
  if (!DB.data.demo && !$('#helios-gz').textContent.trim()) timer = setInterval(() => { if (document.visibilityState === 'visible') boot(true); }, CONFIG.refreshMin * 60000);
  const r = $('#reload'); if (r) r.textContent = 'Atualizar';
}
let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => DB && render(), 250); });
document.documentElement.dataset.mode = store.get('mode') || 'dark';
boot();
</script>
</body>
