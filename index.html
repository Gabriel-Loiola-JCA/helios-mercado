    `<p class="insight">${esc(us)} tem <em>${pct(T.share)}</em> do que já foi vendido para os próximos 14 dias (${n0(T.upax)} de ${n0(T.pax)} poltronas).</p>
    ${columns(pts, {label: (x) => x.d === DB.today ? 'hoje' : `${WD[wdOf(x.d)]} ${x.d.slice(8)}`, us: (x) => x.t.upax, them: (x) => x.t.them, top: (x) => x.t.pax ? pct(x.t.share, 0) : '',
      tip: (x) => `${WDL[wdOf(x.d)]} ${br(x.d)}${x.d === DB.today ? ' (hoje)' : ` · D-${diffD(x.d, DB.today)}`}\n${us}: ${n0(x.t.upax)} · concorrência: ${n0(x.t.them)}\nParcela ${pct(x.t.share)} · ocupação ${pct(x.t.lfUs, 0)} × ${pct(x.t.lfThem, 0)}`})}`);
}

/* 8 · ritmo de compra */
function modPace() {
  const S = DB.sales.filter((s) => (!F.routes.size || F.routes.has(s.r)) && (!F.classes.size || F.classes.has(s.c)));
  if (!S.length) return mod('Ritmo de compra', '', '<div class="empty">Ainda sem vendas detectadas.</div>');
  const last = S.reduce((a, s) => a > s.d ? a : s.d, '');
  const days = []; for (let d = addD(last, -29); d <= last; d = addD(d, 1)) days.push(d);
  const by = groupBy(S, (s) => s.d);
  const pts = days.map((d) => { const l = by.get(d) || []; let u = 0, t = 0; for (const s of l) { t += s.pax; if (isUs(s)) u += s.pax; } return {d, u, t, them: t - u}; });
  const us = focusShort();
  const half = (arr) => arr.reduce((n, x) => n + x.t, 0);
  const a = half(pts.slice(-7)), b = half(pts.slice(-14, -7));
  const ua = pts.slice(-7).reduce((n, x) => n + x.u, 0), ub = pts.slice(-14, -7).reduce((n, x) => n + x.u, 0);
  const leadL = ['no dia', 'na véspera', '2–3 dias antes', '4–7 dias antes', '8+ dias antes'];
  const byA = groupBy(S.filter((s) => s.d > addD(last, -14)), (s) => s.a);
  const mix = [0, 1, 2, 3, 4].map((k) => { const l = byA.get(k) || []; let u = 0, t = 0; for (const s of l) { t += s.pax; if (isUs(s)) u += s.pax; } return {name: leadL[k], u, t}; });
  return mod('Ritmo de compra', `Poltronas que o Helios viu sair do estoque a cada dia (dia da compra, não da viagem). Mostra se os passageiros estão comprando — e onde.`,
    `<p class="insight">Últimos 7 dias: mercado <em>${dpct(b ? a / b - 1 : NaN)}</em>, ${esc(us)} <em>${dpct(ub ? ua / ub - 1 : NaN)}</em> contra a semana anterior.</p>
    ${columns(pts, {label: (x) => days.indexOf(x.d) % 5 === 0 ? br(x.d) : '', us: (x) => x.u, them: (x) => x.them,
      tip: (x) => `Compras em ${WDL[wdOf(x.d)].toLowerCase()} ${br(x.d)}\n${us}: ${n0(x.u)} · concorrência: ${n0(x.them)}\nParcela das compras ${pct(x.t ? x.u / x.t : NaN)}`})}
    <div><p class="h4">Com quanta antecedência compram · últimos 14 dias</p>
    ${hbars(mix, {val: (x) => x.t, us: () => false, right: (x) => `${n0(x.t)} <em>${esc(us)} ${pct(x.t ? x.u / x.t : NaN, 0)}</em>`, tip: (x) => `Compras ${x.name}\nMercado ${n0(x.t)} · ${us} ${n0(x.u)} (${pct(x.t ? x.u / x.t : NaN)})`})}</div>`);
}

/* 9 · tabela */
let tSort = {k: 'pax', d: -1}, tQ = '';
function tableRows(cur, prev) {
  const key = (r) => r.r + '|' + companyKey(r);
  const a = groupBy(cur, key), b = groupBy(prev, key);
  const mkt = new Map(), mktP = new Map();
  for (const r of cur) mkt.set(r.r, (mkt.get(r.r) || 0) + r.pax);
  for (const r of prev) mktP.set(r.r, (mktP.get(r.r) || 0) + r.pax);
  return [...a.entries()].map(([k, l]) => { const [ri, ck] = k.split('|'); const t = tot(l); const y = (b.get(k) || []).reduce((n, r) => n + r.pax, 0);
    const s = t.pax / (mkt.get(Number(ri)) || 1), sp = mktP.get(Number(ri)) ? y / mktP.get(Number(ri)) : NaN;
    return {route: shortRoute(DB.dims.rotas[ri].l), co: companyName(ck), ck, us: companyIsUs(ck), pax: t.pax, s, ds: s - sp, cap: t.cap, n: t.n, lf: t.cap ? t.pax / t.cap : NaN, rec: t.rec, tk: t.pax ? t.rec / t.pax : NaN}; });
}
const TCOLS = [['route', 'Linha'], ['co', 'Viação'], ['pax', 'Passageiros'], ['s', 'Parcela na linha'], ['ds', 'Variação'], ['n', 'Ônibus'], ['cap', 'Poltronas'], ['lf', 'Ocupação'], ['tk', 'Tíquete médio'], ['rec', 'Receita est.']];
function modTable(cur, prev) {
  let rows = tableRows(cur, prev); const q = tQ.toLowerCase();
  if (q) rows = rows.filter((r) => (r.route + ' ' + r.co).toLowerCase().includes(q));
  rows.sort((x, y) => { const a = x[tSort.k], b = y[tSort.k]; return (typeof a === 'string' ? a.localeCompare(b, 'pt-BR') : (Number.isFinite(a) ? a : -Infinity) - (Number.isFinite(b) ? b : -Infinity)) * tSort.d; });
  window.__rows = rows;
  const fmt = {pax: (r) => n0(r.pax), s: (r) => `<span class="minibar"><i style="width:${Math.min(100, r.s * 100)}%"></i></span>${pct(r.s)}`, ds: (r) => prev.length && Number.isFinite(r.ds) ? deltaPill(r.ds) : '—',
    n: (r) => n0(r.n), cap: (r) => n0(r.cap), lf: (r) => pct(r.lf, 0), tk: (r) => money(r.tk), rec: (r) => money(r.rec), route: (r) => esc(r.route), co: (r) => dot(r.ck) + esc(r.co)};
  return mod('Tudo em tabela', 'Linha × viação no recorte. Clique no título da coluna para ordenar.',
    `<div class="tools"><label class="search"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="tq" placeholder="Buscar linha ou viação" value="${esc(tQ)}"></label><span class="sp" style="flex:1"></span><button class="btn" id="csvB">Exportar CSV</button></div>
    <div class="tbl-wrap"><table><thead><tr>${TCOLS.map(([k, l]) => `<th data-k="${k}"${tSort.k === k ? ` aria-sort="${tSort.d > 0 ? 'ascending' : 'descending'}"` : ''}>${l}</th>`).join('')}</tr></thead>
    <tbody>${rows.slice(0, 400).map((r) => `<tr class="${r.us ? 'us' : ''}">${TCOLS.map(([k]) => `<td>${fmt[k](r)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${TCOLS.length}" class="mut">Sem dados.</td></tr>`}</tbody></table></div>
    ${rows.length > 400 ? `<p class="note">Mostrando 400 de ${n0(rows.length)} — use a busca ou exporte.</p>` : ''}`);
}
function bindTable() {
  $$('th[data-k]').forEach((th) => th.onclick = () => {
    const k = th.dataset.k;
    transitionView((animated) => { tSort = {k, d: tSort.k === k ? -tSort.d : (k === 'route' || k === 'co' ? 1 : -1)}; render(!animated); }, 'table');
  });
  const q = $('#tq'); if (q) q.oninput = () => { tQ = q.value; const p = q.selectionStart; render(true); const n = $('#tq'); n.focus({preventScroll:true}); n.setSelectionRange(p, p); };
  const c = $('#csvB'); if (c) c.onclick = () => {
    const cell = (v) => v == null || (typeof v === 'number' && !Number.isFinite(v)) ? '' : typeof v === 'number' ? String(Math.round(v * 10000) / 10000).replace('.', ',') : `"${String(v).replace(/"/g, '""')}"`;
    const lines = [TCOLS.map((c) => c[1]).join(';'), ...window.__rows.map((r) => TCOLS.map(([k]) => cell(r[k])).join(';'))];
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
    const {a: d0, b: d1} = ranges(); a.download = `helios_mercado_${d0}_${d1}.csv`; a.click(); URL.revokeObjectURL(a.href); };
  const m = $('#modeS'); if (m) m.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b || b.dataset.m === F.mode) return;
    F.mode = b.dataset.m; update();
  };
}

const marketPlan = {period: 'week', gain: 1};
const planPeriods = [['day', 'Dia'], ['week', 'Semana'], ['range', 'Período']];
const planGains = [1, 2, 5];

function planWindow(rows, range, realized, period) {
  const observed = rows.reduce((edge, row) => {
    if (!edge) return row.d;
    return (realized ? row.d > edge : row.d < edge) ? row.d : edge;
  }, null);
  if (!observed) return null;
  if (period === 'range') return {a: range.a, b: range.b};
  if (period === 'day') return {a: observed, b: observed};
  const a = realized ? addD(observed, -6) : observed;
  const b = realized ? observed : addD(observed, 6);
  return {a: a < range.a ? range.a : a, b: b > range.b ? range.b : b};
}

function planSeatScenario(total, own, gain) {
  if (!Number.isFinite(total) || !Number.isFinite(own) || !(total > 0) || own < 0 || own > total) return null;
  const share = own / total;
  const target = share + gain / 100;
  // Só as vendas do foco crescem. As demais ficam constantes.
  const incremental = (target * total - own) / (1 - target);
  const seats = target < 1 ? Math.max(1, Math.ceil(incremental - 1e-9)) : null;
  return {share, target, seats};
}

function planSensitivity(rows, cutoff, own) {
  if (!cutoff) return {pairs: 0, value: null};
  const start = addD(cutoff, -29);
  const observations = new Map();
  for (const row of rows) {
    if (row.open || row.d < start || row.d > cutoff || !own(row) || !(row.cap > 0)) continue;
    const weekend = row.wd === 0 || row.wd === 6;
    const key = [row.r, row.v, row.c, row.h, weekend].join('|');
    if (!observations.has(key)) observations.set(key, new Map());
    const days = observations.get(key);
    const day = days.get(row.d) || {cap: 0, pax: 0, revenue: 0, complete: true};
    day.cap += row.cap;
    day.pax += row.pax;
    day.revenue += row.rec;
    if (!Number.isFinite(row.pax) || row.pax < 0 || (row.pax > 0 && !(row.rec > 0))) day.complete = false;
    days.set(row.d, day);
  }
  const midpoint = (a, b) => 2 * (b - a) / (b + a);
  const matches = [];
  for (const days of observations.values()) {
    const ordered = [...days.entries()].sort(([a], [b]) => a.localeCompare(b));
    for (let i = 1; i < ordered.length; i++) {
      const [priorDate, prior] = ordered[i - 1], [date, day] = ordered[i];
      if (diffD(date, priorDate) > 14 || !prior.complete || !day.complete || prior.pax < 5 || day.pax < 5) continue;
      const priorLoad = prior.pax / prior.cap, load = day.pax / day.cap;
      // Lotação perto do teto pode esconder demanda que não conseguiu comprar.
      if (priorLoad >= .95 || load >= .95) continue;
      const priceMove = midpoint(prior.revenue / prior.pax, day.revenue / day.pax);
      if (!(Math.abs(priceMove) >= .05)) continue;
      matches.push({value: midpoint(priorLoad, load) / priceMove, weight: Math.min(prior.cap, day.cap)});
    }
  }
  if (matches.length < 8) return {pairs: matches.length, value: null};
  matches.sort((a, b) => a.value - b.value);
  let remaining = matches.reduce((sum, match) => sum + match.weight, 0) / 2;
  const typical = matches.find((match) => (remaining -= match.weight) <= 0);
  return {pairs: matches.length, value: typical.value};
}

function modMarketPlan(rows, range, realized) {
  const period = planWindow(rows, range, realized, marketPlan.period);
  const selected = period ? rows.filter((row) => row.d >= period.a && row.d <= period.b) : [];
  const sample = tot(selected);
  const scenario = planSeatScenario(sample.pax, sample.upax, marketPlan.gain);
  const ticket = selected.reduce((price, row) => {
    if (!isUs(row) || !(row.pax > 0) || !(row.rec > 0)) return price;
    price.passengers += row.pax;
    price.revenue += row.rec;
    return price;
  }, {passengers: 0, revenue: 0});
  const reference = ticket.passengers ? ticket.revenue / ticket.passengers : null;
  const spare = Math.max(0, Math.floor(sample.ucap - sample.upax + 1e-9));
  const dateText = period ? (period.a === period.b ? brY(period.a) : `${br(period.a)} a ${br(period.b)}`) : 'Sem datas no filtro';
  const observedDays = new Set(selected.map((row) => row.d)).size;
  const coverage = period && observedDays < diffD(period.b, period.a) + 1 ? ` · ${observedDays} ${observedDays === 1 ? 'dia observado' : 'dias observados'}` : '';
  const dateTitle = `${realized ? 'Realizado' : 'Em venda'} · ${dateText}${coverage}`;
  const matchRows = DB.rows.filter((row) => !row.open && dimOk(row) && hourOk(row.h));
  const cutoff = realized && period && period.b < DB.lastClosed ? period.b : DB.lastClosed;
  const sensitivity = planSensitivity(matchRows, cutoff, isUs);
  const showSensitivity = sensitivity.value !== null;
  const elastic = showSensitivity ? Math.abs(sensitivity.value) : null;
  const rate = showSensitivity ? NF1.format(sensitivity.value) : '—';
  const rateText = showSensitivity ? `+1% na tarifa ↔ ${sensitivity.value > 0 ? '+' : ''}${rate}% na ocupação · ${n0(sensitivity.pairs)} pares` : 'Histórico insuficiente';
  const meter = showSensitivity ? `<div class="plan-scale" aria-hidden="true"><div><span style="--level:${Math.min(100, 100 * elastic / 3)}%"></span></div><small>Menor sensibilidade</small><small>Maior sensibilidade</small></div>` : '';
  const group = esc(focusShort());
  const seats = scenario?.seats ?? null;
  const goal = scenario ? `${pct(scenario.share)} → ${pct(scenario.target)} de parcela` : '';
  const price = reference !== null ? offerPrice.format(reference) : '';
  const volume = seats !== null ? `~${n0(seats)} poltronas` : '';
  const pricing = price ? `a <strong>${price}</strong> por poltrona · simulação` : 'Tarifa de referência indisponível';
  return `<div class="plan-card">
    <div class="plan-top"><div><p class="eyebrow">Parcela de mercado</p><h2>Meta de ganho</h2></div>
      <div class="plan-switch" role="group" aria-label="Janela da meta">${planPeriods.map(([key, label]) => `<button type="button" data-plan-period="${key}" aria-pressed="${marketPlan.period === key}">${label}</button>`).join('')}</div></div>
    <div class="plan-base" data-plan-window>${dateTitle} · ${group}</div>
    <div class="plan-switch plan-target" role="group" aria-label="Ganho desejado em pontos percentuais">${planGains.map((gain) => `<button type="button" data-plan-gain="${gain}" aria-pressed="${marketPlan.gain === gain}">+${gain} p.p.</button>`).join('')}</div>
    <div class="plan-result" aria-live="polite">${volume ? `<p>Precisamos vender <strong data-plan-seats>${volume}</strong></p><p data-plan-price>${pricing}</p><p class="plan-note">${goal}${seats > spare ? ' · acima da folga observada' : ''}</p>` : `<p data-plan-seats>${scenario ? 'Ganho acima do limite de parcela.' : 'Ainda sem base para a meta neste recorte.'}</p>`}</div>
    <section class="plan-elasticity" data-plan-elasticity><div class="plan-elasticity-head"><div><p class="eyebrow">Preço × ocupação</p><h3>Elasticidade observada</h3></div><strong aria-label="Elasticidade observada ${rate}">${rate}</strong></div>
      ${meter}<p>${rateText}${showSensitivity ? '' : ` · ${n0(sensitivity.pairs)} de 8 pares mínimos`}</p>
      <details class="plan-method"><summary>Como ler</summary><p>A meta supõe vendas constantes das outras viações. A referência é a tarifa média estimada, ponderada pelas poltronas ocupadas nas observações com preço.</p><p>A elasticidade mostra a variação percentual da ocupação associada a 1% de variação na tarifa estimada. Usa a mediana ponderada pela oferta de até 30 dias fechados, com a mesma linha, viação, classe, faixa de partida e tipo de dia. Cada par tem ao menos 5% de variação no preço. É uma associação histórica, sem previsão de demanda.</p></details>
    </section>
  </div>`;
}

function bindMarketPlan(rows, range, realized) {
  const panel = $('#planning');
  if (!panel) return;
  panel.onclick = (event) => {
    const button = event.target.closest('button[data-plan-period], button[data-plan-gain]');
    if (!button || button.getAttribute('aria-pressed') === 'true') return;
    if (button.dataset.planPeriod) marketPlan.period = button.dataset.planPeriod;
    else marketPlan.gain = Number(button.dataset.planGain);
    const attribute = button.dataset.planPeriod ? 'data-plan-period' : 'data-plan-gain';
    transitionView((animated) => {
      paintDashboard(panel, modMarketPlan(rows, range, realized));
      if (!animated) animateDashboard(panel);
      panel.querySelector(`[${attribute}="${button.getAttribute(attribute)}"]`)?.focus({preventScroll: true});
    }, 'planning');
  };
}

/* Movimento do painel */
let activeViewMotion = null;
function transitionView(apply, kind) {
  if (sentinelMotion.matches || typeof document.startViewTransition !== 'function' || document.visibilityState !== 'visible') {
    apply(false);
    return;
  }
  activeViewMotion?.skipTransition();
  hideTip();
  const root = document.documentElement;
  root.dataset.motion = kind;
  const motion = document.startViewTransition(() => apply(true));
  activeViewMotion = motion;
  motion.ready.catch(() => {});
  motion.finished.catch((error) => console.error('Falha ao atualizar o painel', error)).finally(() => {
    if (activeViewMotion !== motion) return;
    activeViewMotion = null;
    delete root.dataset.motion;
    flush();
  });
}
const movingDashboard = '#filterReceipt, #briefing > section, #hourly, #quickCharts, #radarGrid > .mod, #analysis, #hero, #kpis, #analysis #main > .mod, footer';
const dashboardAnimations = new WeakMap();
const revealedDashboard = new WeakSet();
const dashboardReveal = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    dashboardReveal.unobserve(entry.target);
    entry.target.classList.remove('reveal-await');
    revealedDashboard.add(entry.target);
    animateDashboard(entry.target, true);
  }
}, {threshold: 0, rootMargin: '0px 0px -16px'});

function animateDashboard(element, revealed = false) {
  if (sentinelMotion.matches) return;
  dashboardAnimations.get(element)?.forEach((animation) => animation.cancel());
  const easing = 'cubic-bezier(.16,1,.3,1)';
  const animations = [element.animate([
    {filter: revealed ? 'blur(3px)' : 'none', transform: `translateY(${revealed ? 12 : 6}px)`},
    {filter: 'none', transform: 'none'},
  ], {duration: revealed ? 720 : 540, easing})];
  const numbers = element.querySelectorAll('.headline-share strong, .nums b, [data-plan-seats]:is(strong), .plan-elasticity-head > strong, .kpi .v, #hour-value');
  numbers.forEach((number, index) => animations.push(number.animate([
    {clipPath: 'inset(100% -8px -8px -8px)', filter: 'blur(4px)', transform: 'translateY(8px)'},
    {clipPath: 'inset(-8px)', filter: 'none', transform: 'none'},
  ], {duration: 630, delay: Math.min(index * 55, 165), fill: 'backwards', easing})));
  if (revealed && element.id !== 'analysis') {
    element.querySelectorAll('.chart-series').forEach((series) => animations.push(series.animate([
      {clipPath: 'inset(-8px 100% -8px -8px)'},
      {clipPath: 'inset(-8px)'},
    ], {duration: 840, delay: 80, fill: 'backwards', easing})));
  }
  dashboardAnimations.set(element, animations);
}

function observeDashboardMotion(changed = null) {
  dashboardReveal.disconnect();
  for (const element of $$(movingDashboard)) {
    element.classList.remove('reveal-await');
    if (sentinelMotion.matches || !element.getClientRects().length) continue;
    const rect = element.getBoundingClientRect();
    if (rect.top >= innerHeight - 16 && !revealedDashboard.has(element)) {
      element.classList.add('reveal-await');
      dashboardReveal.observe(element);
    } else if (rect.top < innerHeight && rect.bottom > 0) {
      revealedDashboard.add(element);
      if (changed?.has(element) || changed?.has(element.parentElement)) animateDashboard(element);
    }
  }
}

sentinelMotion.addEventListener('change', () => { if (sentinelMotion.matches) activeViewMotion?.skipTransition(); observeDashboardMotion(); });
document.addEventListener('toggle', (event) => {
  if (event.target.matches('#quickCharts, #analysis, .today-detail, .footer-method')) observeDashboardMotion();
}, true);

/* ---------- partida e atualização em segundo plano ---------- */
let lastFetch = 0, sig = '', pending = null, busy = false, failed = false;
const lastClickBus = (d) => {
  const sources = d.coleta?.fontes;
  const click = sources?.find((source) => source.f === 'ClickBus');
  return click ? click.ultimaValida ?? click.ultima : sources?.length ? '' : d.coleta?.ultimaLeitura;
};
function collectionStatus(data) {
  const last = lastClickBus(data);
  const mins = last ? (Date.now() - brtMs(last)) / 60000 : Infinity;
  const tick = data.coleta?.automacao;
  if (data.demo) return {text: 'Demonstração', alert: false};
  if (tick && Date.now() - tick.at > 25 * 60000) return {text: 'Gatilho sem resposta', alert: true};
  if (tick?.state === 'orcamento') return {text: 'Pausa por limite de execução', alert: true};

  if (tick?.state === 'erro') return {text: 'Erro na automação', alert: true};
  if (tick?.clickbusUntil > Date.now()) return {text: 'ClickBus em pausa', alert: true};
  if (!last) return {text: 'Sem leitura válida', alert: !!data.coleta};

}
const signature = (d) => JSON.stringify([d.hoje, d.coleta?.ultimaLeitura, lastClickBus(d), d.dims, d.hojeHoras, d.viagens?.rows, d.vendas?.rows, d.quero, d.busco, d.poltronas, d.memoriaPoltronas, d.coleta?.automacao]);
const isStatic = () => !DB || DB.data.demo || !!$('#helios-gz').textContent.trim();
function stampTick() {

  b.title = isStatic() ? 'Dados fixos' : `Última leitura da ClickBus: ${last ? last.slice(8, 10) + '/' + last.slice(5, 7) + ' ' + last.slice(11) : '—'}\nPágina conferida ${lastFetch ? new Date(lastFetch).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : '—'} · busca sozinha a cada ${CONFIG.refreshMin} min\nClique para buscar agora`;

function flush() {
  if (!pending || !DB || filterFrame || activeViewMotion || !canRender()) return;
  const next = pending;
  pending = null;
  transitionView((animated) => {
    const y = scrollY;
    const previous = DB.dims;

    if (!DB.hasClosed) F.view = 'venda';
    if (JSON.stringify(previous) !== JSON.stringify(DB.dims)) {
      const match = (items, label, key) => items.findIndex((item) => key(item) === label);
      const remap = (selected, before, after, key) => new Set([...selected]
        .filter((index) => before[index] !== undefined).map((index) => match(after, key(before[index]), key)).filter((index) => index >= 0));
      F.routes = remap(F.routes, previous.rotas, DB.dims.rotas, (route) => route.l);
      F.classes = remap(F.classes, previous.classes, DB.dims.classes, (name) => name);
      if (F.focus !== 'JCA') {
        const index = match(DB.dims.viacoes, previous.viacoes[Number(F.focus)]?.n, (company) => company.n);
        F.focus = index < 0 ? 'JCA' : String(index);

}
